configuration:
  timezone:
    name: "Fuseau horaire"
    description: "Fuseau horaire IANA utilisé par OpenClaw, par exemple Europe/Paris."
  gateway_token:
    name: "Jeton du Gateway"
    description: "Au moins 24 caractères. Recommandé. Si vide, un jeton aléatoire est généré dans le stockage privé de l'App."
  allowed_origins:
    name: "Origines navigateur autorisées"
    description: "Origines HTTPS exactes séparées par des virgules, par exemple https://192.168.1.10:18789."
  mobile_pairing_url:
    name: "URL d’appairage mobile"
    description: "Adresse WebSocket TLS joignable depuis le téléphone et encodée dans le QR, par exemple wss://192.168.1.10:18789."
  ha_mcp_url:
    name: "URL privée HA-MCP"
    description: "URL Streamable HTTP facultative affichée par l'App HA-MCP existante et terminant par /private_<secret>."
network:
  18789/tcp: "Gateway HTTPS/WSS et interface OpenClaw authentifiés ; limiter au LAN ou au VPN."
