configuration:
  timezone:
    name: "Fuseau horaire"
    description: "Fuseau horaire IANA utilisé par OpenClaw, par exemple Europe/Paris."
  gateway_token:
    name: "Jeton du Gateway"
    description: "Au moins 24 caractères. Recommandé. Si vide, un jeton aléatoire est généré dans le stockage privé de l'App."
  allowed_origins:
    name: "Origines navigateur autorisées"
    description: "Origines HTTP(S) exactes séparées par des virgules, par exemple http://192.168.1.10:18789."
  allow_insecure_http:
    name: "Autoriser temporairement le Control UI en HTTP"
    description: "DANGEREUX : désactive l'identité cryptographique du navigateur. Uniquement pour un accès privé LAN/VPN protégé par le jeton Gateway."
  ha_mcp_url:
    name: "URL privée HA-MCP"
    description: "URL Streamable HTTP facultative affichée par l'App HA-MCP existante et terminant par /private_<secret>."
network:
  18789/tcp: "Gateway et interface OpenClaw authentifiés ; limiter au LAN ou au VPN."
