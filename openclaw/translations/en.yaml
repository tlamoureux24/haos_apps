configuration:
  timezone:
    name: "Timezone"
    description: "IANA timezone used by OpenClaw, for example Europe/Paris."
  gateway_token:
    name: "Gateway token"
    description: "At least 24 characters. Recommended. If empty, a random token is generated in private app storage."
  allowed_origins:
    name: "Allowed browser origins"
    description: "Comma-separated exact HTTP(S) origins allowed to open Control UI, for example http://192.168.1.10:18789."
  mobile_pairing_url:
    name: "Mobile pairing URL"
    description: "WebSocket address reachable by the phone and encoded in the QR, for example ws://192.168.1.10:18789."
  allow_insecure_http:
    name: "Temporarily allow Control UI over HTTP"
    description: "DANGEROUS: disables browser cryptographic device identity. Use only on a private LAN/VPN protected by the Gateway token."
  openai_oauth_device_login:
    name: "Start ChatGPT/Codex sign-in"
    description: "Temporary: prints an OAuth URL and code in the App log. Disable it and restart the App after sign-in succeeds."
  ha_mcp_url:
    name: "HA-MCP private URL"
    description: "Optional private Streamable HTTP URL printed by the existing HA-MCP app, ending in /private_<secret>."
network:
  18789/tcp: "Authenticated OpenClaw Gateway and Control UI; restrict to the LAN or VPN."
