name: "OpenClaw"
slug: "openclaw"
version: "2026.7.1-12"
description: "Official OpenClaw gateway packaged as a Home Assistant app"
url: "https://github.com/tlamoureux24/haos_apps/tree/main/openclaw"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
apparmor: true
backup: cold
webui: "https://[HOST]:[PORT:18789]/"

ingress: true
ingress_port: 7681
panel_admin: true
panel_icon: "mdi:console-line"
panel_title: "OpenClaw CLI"

ports:
  18789/tcp: 18789

ports_description:
  18789/tcp: "OpenClaw HTTPS/WSS Gateway and Control UI; keep restricted to the LAN or VPN"

map:
  - type: addon_config
    read_only: false

options:
  timezone: "Europe/Paris"
  gateway_token: ""
  allowed_origins: "https://homeassistant.local:18789"
  mobile_pairing_url: ""
  ha_mcp_url: ""

schema:
  timezone: str
  gateway_token: password?
  allowed_origins: str
  mobile_pairing_url: str
  ha_mcp_url: password?
