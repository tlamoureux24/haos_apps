name: "Agent Gateway"
slug: "agent_gateway"
version: "0.1.29"
description: "Governed automation gateway for MCP-compatible agents"
url: "https://github.com/tlamoureux24/haos_apps/tree/main/agent_gateway"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
stage: experimental
apparmor: true
tmpfs: true
backup: cold
ingress: true
ingress_port: 8099
panel_icon: "mdi:shield-link-variant"
panel_title: "Agent Gateway"
panel_admin: true
homeassistant_api: true
watchdog: "http://[HOST]:[PORT:8098]/health/ready"

ports:
  8098/tcp: null

ports_description:
  8098/tcp: "Authenticated MCP and event intake API"

options:
  log_level: "info"

schema:
  log_level: "list(debug|info|warning|error)"
