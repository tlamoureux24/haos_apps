configuration:
  log_level:
    name: Log level
    description: Controls the verbosity of the App technical logs. Secrets remain redacted at every level.
  intake_rate_limit_per_minute:
    name: Events per minute limit
    description: Maximum new events accepted per minute for each identity. Idempotent replays are not counted.
  ha_mcp_url:
    name: Private HA-MCP URL
    description: Complete Streamable HTTP URL displayed by HA-MCP and ending in /private_<secret>. It remains protected and is never sent to agents.
network:
  8098/tcp:
    name: MCP and event port
    description: Optional port for authenticated MCP clients and event sources. Expose it only on a trusted local network or VPN.
