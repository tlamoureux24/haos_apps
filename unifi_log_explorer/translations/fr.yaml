configuration:
  allowed_source_ips:
    name: IP sources autorisées
    description: Seuls les datagrammes provenant exactement de ces adresses IP sont analysés ou conservés.
  retention_hours:
    name: Rétention diagnostique (heures)
    description: Supprime les enregistrements diagnostiques plus anciens que cette durée.
  max_records:
    name: Nombre maximal d'enregistrements
    description: Limite stricte partagée entre les diagnostics IPFIX et CEF.
  session_timeout_minutes:
    name: Expiration de session web (minutes)
    description: Les sessions administrateur inactives expirent après cette durée.
  log_level:
    name: Niveau de journalisation
    description: Niveau de détail des journaux de l'application.
network:
  8090/tcp: Interface web d'administration
  2055/udp: Récepteur NetFlow/IPFIX
  5514/udp: Récepteur Syslog/CEF
