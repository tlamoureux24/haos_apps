configuration:
  allowed_source_ips:
    name: IP sources autorisées
    description: Seuls les datagrammes provenant exactement de ces adresses IP sont analysés ou conservés.
  retention_hours:
    name: Rétention diagnostique (heures)
    description: Supprime les enregistrements diagnostiques plus anciens que cette durée.
  max_records:
    name: Nombre maximal d'enregistrements
    description: Limite stricte partagée entre les diagnostics IPFIX et CEF.
  session_timeout_minutes:
    name: Expiration de session web (minutes)
    description: Les sessions administrateur inactives expirent après cette durée.
  unifi_base_url:
    name: URL de la console UniFi
    description: URL HTTPS locale de la passerelle UniFi Cloud Gateway.
  unifi_site_slug:
    name: Identifiant interne du site UniFi
    description: Nom du site utilisé par l'endpoint Traffic Flows, généralement default.
  unifi_api_key:
    name: Clé API UniFi
    description: Clé dédiée chiffrée localement puis effacée des options après redémarrage.
  verify_ssl:
    name: Vérifier le certificat TLS
    description: Activez uniquement si le certificat de la console est reconnu par l'App.
  flow_collection_enabled:
    name: Activer la collecte des Traffic Flows
    description: Archive périodiquement les Traffic Flows complets via l'API UniFi locale.
  flow_poll_interval_seconds:
    name: Intervalle de collecte des flows (secondes)
    description: Délai entre deux cycles de collecte Traffic Flows.
  flow_initial_backfill_minutes:
    name: Historique initial des flows (minutes)
    description: Période importée lors d'un rattrapage ; les migrations utilisent au minimum 1440 minutes.
  log_level:
    name: Niveau de journalisation
    description: Niveau de détail des journaux de l'application.
network:
  8090/tcp: Interface web d'administration
  2055/udp: Récepteur NetFlow/IPFIX
  5514/udp: Récepteur Syslog/CEF
