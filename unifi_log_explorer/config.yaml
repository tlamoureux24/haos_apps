name: "UniFi Log Explorer"
slug: "unifi_log_explorer"
version: "0.5.0"
description: "Explore UniFi Traffic Flows, Syslog and CEF data locally"
url: "https://github.com/tlamoureux24/haos_apps/tree/main/unifi_log_explorer"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
apparmor: true
tmpfs: true
backup: cold
hassio_api: true
backup_exclude:
  - /data/unifi_api_key.key
webui: "http://[HOST]:[PORT:8090]/"
watchdog: "http://[HOST]:[PORT:8090]/health"

ports:
  8090/tcp: 8090
  5514/udp: 5514

ports_description:
  8090/tcp: "UniFi Log Explorer administration interface"
  5514/udp: "UniFi Syslog/CEF receiver"

options:
  allowed_source_ips:
    - "192.168.1.1"
  retention_hours: 168
  max_records: 250000
  session_timeout_minutes: 60
  unifi_base_url: "https://192.168.1.1"
  unifi_site_slug: "default"
  unifi_api_key: ""
  verify_ssl: false
  flow_collection_enabled: false
  flow_poll_interval_seconds: 120
  flow_initial_backfill_minutes: 1440
  log_level: "info"

schema:
  allowed_source_ips:
    - str
  retention_hours: "int(1,720)"
  max_records: "int(1000,2000000)"
  session_timeout_minutes: "int(5,1440)"
  unifi_base_url: url
  unifi_site_slug: str
  unifi_api_key: password?
  verify_ssl: bool
  flow_collection_enabled: bool
  flow_poll_interval_seconds: "int(30,3600)"
  flow_initial_backfill_minutes: "int(5,1440)"
  log_level: "list(debug|info|warning|error)"
