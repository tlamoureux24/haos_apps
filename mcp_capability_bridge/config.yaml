name: "MCP Capability Bridge"
slug: "mcp_capability_bridge"
version: "0.1.0"
description: "Bounded technical capabilities exposed through standard MCP"
url: "https://github.com/tlamoureux24/haos_apps/tree/main/mcp_capability_bridge"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
stage: experimental
apparmor: true
tmpfs: true
backup: cold
ingress: true
ingress_port: 8099
panel_icon: "mdi:bridge"
panel_title: "MCP Capability Bridge"
panel_admin: true
watchdog: "http://[HOST]:[PORT:8098]/health/ready"

ports:
  8098/tcp: null

ports_description:
  8098/tcp: "Public MCP surface (health only until Lot 1)"

options:
  log_level: "info"

schema:
  log_level: "list(debug|info|warning|error)"
