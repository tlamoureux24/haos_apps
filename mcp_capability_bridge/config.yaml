name: "MCP Capability Bridge"
slug: "mcp_capability_bridge"
version: "1.1.7"
description: "Bounded technical capabilities exposed through standard MCP"
url: "https://github.com/tlamoureux24/haos_apps/tree/main/mcp_capability_bridge"
arch:
  - amd64
startup: services
boot: auto
init: false
stage: stable
apparmor: true
tmpfs: true
backup: cold
ingress: true
ingress_port: 8099
panel_icon: "mdi:bridge"
panel_title: "MCP Capability Bridge"
panel_admin: true
map:
  - type: ssl
watchdog: "http://[HOST]:[PORT:8099]/health/ready"

ports:
  8098/tcp: null

ports_description:
  8098/tcp: "Authenticated MCP Streamable HTTP surface"

options:
  log_level: "info"
  public_transport: "https"
  certificate_source: "self_generated"
  certfile: ""
  keyfile: ""

schema:
  log_level: "list(debug|info|warning|error)"
  public_transport: "list(http|https)"
  certificate_source: "list(self_generated|external)"
  certfile: "str?"
  keyfile: "str?"
