name: "Agent Control Plane"
slug: "agent_control_plane"
version: "0.46.8"
description: "Governed control plane for MCP-compatible agents"
url: "https://github.com/tlamoureux24/haos_apps/tree/main/agent_control_plane"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
stage: stable
apparmor: true
tmpfs: true
backup: cold
ingress: true
ingress_port: 8099
panel_icon: "mdi:shield-link-variant"
panel_title: "Agent Control Plane"
panel_admin: true
homeassistant_api: true
watchdog: "http://[HOST]:[PORT:8098]/health/ready"

ports:
  8098/tcp: null

ports_description:
  8098/tcp: "Authenticated MCP and event intake API"

options:
  log_level: "info"
  intake_rate_limit_per_minute: 30

schema:
  log_level: "list(debug|info|warning|error)"
  intake_rate_limit_per_minute: "int(1,600)"

