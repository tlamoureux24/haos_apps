configuration:
  log_level:
    name: Niveau de journalisation
    description: Contrôle le niveau de détail des journaux techniques de l’App. Les secrets restent masqués quel que soit le niveau.
  intake_rate_limit_per_minute:
    name: Limite d’événements par minute
    description: Nombre maximal de nouveaux événements accepté par minute pour chaque identité. Les rejeux idempotents ne sont pas comptés.
  events_transport:
    name: Transport de l’API événements
    description: HTTP n’est pas chiffré ; HTTPS utilise le certificat ACP partagé.
  mcp_transport:
    name: Transport MCP
    description: HTTPS est activé par défaut pour les workers.
  certificate_source:
    name: Source du certificat
    description: Utilise un certificat généré persistant ou un certificat externe depuis /ssl.
  certfile:
    name: Fichier du certificat
    description: Nom relatif sous /ssl pour un certificat externe.
  keyfile:
    name: Fichier de clé privée
    description: Nom relatif sous /ssl pour un certificat externe.
network:
  8098/tcp: "Endpoint MCP authentifié utilisé par AEP et les autres workers."
  8100/tcp: "API de réception des événements authentifiés."
