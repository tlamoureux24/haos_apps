configuration:
  log_level:
    name: Log level
    description: Controls application log verbosity; sensitive execution content is never logged.
  public_transport:
    name: Standalone API transport
    description: HTTP is unencrypted; HTTPS is enabled by default.
  certificate_source:
    name: Certificate source
    description: Use a persistent generated certificate or an external certificate from /ssl.
  certfile:
    name: Certificate file
    description: Relative filename below /ssl for an external certificate.
  keyfile:
    name: Private key file
    description: Relative filename below /ssl for an external certificate.
network:
  8098/tcp:
    name: Standalone API port
    description: Host port for the Bearer-authenticated standalone execution API; health endpoints remain public and non-sensitive.
