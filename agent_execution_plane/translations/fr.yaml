configuration:
  log_level:
    name: Niveau de journalisation
    description: Contrôle la verbosité des journaux applicatifs ; le contenu sensible des exécutions n’est jamais journalisé.
  public_transport:
    name: Transport de l’API autonome
    description: HTTP n’est pas chiffré ; HTTPS est activé par défaut.
  certificate_source:
    name: Source du certificat
    description: Utilise un certificat généré persistant ou un certificat externe depuis /ssl.
  certfile:
    name: Fichier du certificat
    description: Nom relatif sous /ssl pour un certificat externe.
  keyfile:
    name: Fichier de clé privée
    description: Nom relatif sous /ssl pour un certificat externe.
network:
  8098/tcp:
    name: Port de l’API autonome
    description: Port hôte de l’API d’exécution autonome protégée par Bearer ; les endpoints de santé restent publics et non sensibles.
