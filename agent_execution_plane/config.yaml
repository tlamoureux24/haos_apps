name: "Agent Execution Plane"
slug: "agent_execution_plane"
version: "1.1.13"
description: "Model reasoning and execution engine shell"
url: "https://github.com/tlamoureux24/haos_apps/tree/main/agent_execution_plane"
arch:
  - amd64
startup: services
boot: auto
init: false
stage: stable
apparmor: true
tmpfs: true
backup: cold
ingress: true
ingress_port: 8099
panel_icon: "mdi:robot-outline"
panel_title: "Agent Execution Plane"
panel_admin: true
map:
  - type: ssl
watchdog: "http://[HOST]:[PORT:8099]/health/ready"

ports:
  8098/tcp: null

ports_description:
  8098/tcp: "Authenticated standalone execution API"

options:
  log_level: "info"
  public_transport: "https"
  certificate_source: "self_generated"
  certfile: ""
  keyfile: ""

schema:
  log_level: "list(debug|info|warning|error)"
  public_transport: "list(http|https)"
  certificate_source: "list(self_generated|external)"
  certfile: "str?"
  keyfile: "str?"
