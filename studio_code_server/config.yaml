name: "Studio Code Server + Codex"
slug: "studio_code_server"
version: "0.1.0"
description: "Browser-based development workspace with Git, Home Assistant tools, and Codex CLI"
url: "https://github.com/tlamoureux24/haos_apps/tree/main/studio_code_server"
arch:
  - aarch64
  - amd64
startup: services
boot: manual
init: false
ingress: true
ingress_port: 1337
ingress_stream: true
panel_icon: "mdi:microsoft-visual-studio-code"
panel_title: "Code + Codex"
hassio_api: true
hassio_role: manager
homeassistant_api: true
backup: cold
map:
  - type: homeassistant_config
    read_only: false
    path: /config
  - type: all_addon_configs
    read_only: false
  - type: addons
    read_only: false
  - type: share
    read_only: false
options:
  log_level: "info"
  workspace_path: "/data/workspace"
  packages: []
  init_commands: []
schema:
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"
  workspace_path: "str"
  packages:
    - "str"
  init_commands:
    - "str"
