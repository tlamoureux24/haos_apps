      - "agent_execution_plane/src/agent_execution_plane/tls_server.py"
      - "mcp_capability_bridge/Dockerfile"
      - "mcp_capability_bridge/config.yaml"
      - "mcp_capability_bridge/run.sh"
      - "mcp_capability_bridge/requirements.txt"
      - "mcp_capability_bridge/src/mcp_capability_bridge/admin_ui.py"
      - "mcp_capability_bridge/src/mcp_capability_bridge/main.py"
      - "mcp_capability_bridge/src/mcp_capability_bridge/mcp_api.py"
      - "mcp_capability_bridge/src/mcp_capability_bridge/runtime.py"
      - "mcp_capability_bridge/src/mcp_capability_bridge/settings.py"
      - "mcp_capability_bridge/src/mcp_capability_bridge/tls.py"
      - "mcp_capability_bridge/src/mcp_capability_bridge/web_adapter.py"
      - "mcp_capability_bridge/src/mcp_capability_bridge/web_sessions.py"
      - "mcp_capability_bridge/src/mcp_capability_bridge/web_tls.py"
      - "scripts/agent_suite_tls_smoke.sh"
      - "scripts/seed_acp_tls_event.py"
      - ".github/workflows/agent-suite-tls-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-suite-tls-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tls-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Run real-socket TLS integration matrix
        run: bash scripts/agent_suite_tls_smoke.sh
