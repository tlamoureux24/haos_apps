name: Validate Agent Suite TLS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-suite-tls-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tls-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Run real-socket TLS integration matrix
        run: bash scripts/agent_suite_tls_smoke.sh
