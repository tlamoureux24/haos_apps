    paths:
      - "agent_control_plane/Dockerfile"
      - "agent_control_plane/config.yaml"
      - "agent_control_plane/run.sh"
      - "agent_control_plane/requirements.txt"
      - "agent_control_plane/src/agent_control_plane/admin_ui.py"
