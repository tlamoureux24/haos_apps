      - "agent_execution_plane/Dockerfile"
      - "agent_execution_plane/config.yaml"
      - "agent_execution_plane/run.sh"
      - "agent_execution_plane/requirements.txt"
      - "agent_execution_plane/src/agent_execution_plane/acp.py"
      - "agent_execution_plane/src/agent_execution_plane/admin_ui.py"
