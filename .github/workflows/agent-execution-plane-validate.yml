name: Validate Agent Execution Plane App

on:
  push:
    branches: [main]
    paths: ["agent_execution_plane/**", ".github/workflows/agent-execution-plane-validate.yml"]
  pull_request:
    paths: ["agent_execution_plane/**", ".github/workflows/agent-execution-plane-validate.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Validate metadata, source, and tests
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --requirement agent_execution_plane/requirements.txt
          python3 agent_execution_plane/scripts/validate.py
          bash -n agent_execution_plane/run.sh
          python3 -m compileall -q agent_execution_plane/src agent_execution_plane/tests
          PYTHONPATH=agent_execution_plane/src python3 -m unittest discover -s agent_execution_plane/tests -v
      - name: Build amd64 image with base provenance
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' agent_execution_plane/config.yaml)"
          docker pull ghcr.io/home-assistant/base:latest
          base_reference="$(docker image inspect ghcr.io/home-assistant/base:latest --format '{{index .RepoDigests 0}}')"
          base_digest="${base_reference##*@}"
          test -n "${base_digest}"
          docker build --build-arg BUILD_ARCH=amd64 --build-arg "BUILD_VERSION=${version}" --build-arg "BASE_IMAGE_DIGEST=${base_digest}" --tag "agent-execution-plane:${version}" agent_execution_plane
          test "$(docker image inspect "agent-execution-plane:${version}" --format '{{index .Config.Labels "org.opencontainers.image.base.digest"}}')" = "${base_digest}"
      - name: Validate Codex executable AppArmor coverage
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' agent_execution_plane/config.yaml)"
          docker run --rm --entrypoint python3 \
            --volume "${PWD}/agent_execution_plane/scripts/validate_codex_apparmor.py:/tmp/validate_codex_apparmor.py:ro" \
            "agent-execution-plane:${version}" /tmp/validate_codex_apparmor.py inventory \
            > agent_execution_plane-codex-executables.txt
          test -s agent_execution_plane-codex-executables.txt
          python3 agent_execution_plane/scripts/validate_codex_apparmor.py validate \
            --inventory agent_execution_plane-codex-executables.txt \
            --apparmor agent_execution_plane/apparmor.txt
          cat agent_execution_plane-codex-executables.txt
      - name: Smoke-test listeners, UI, logs, and persistence
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' agent_execution_plane/config.yaml)"
          root="${RUNNER_TEMP}/aep-smoke"; mkdir -p "${root}/data"
          cleanup(){ docker logs aep-smoke 2>&1 || true; docker rm -f aep-smoke >/dev/null 2>&1 || true; docker network rm aep-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker network create aep-smoke >/dev/null
          gateway="$(docker network inspect aep-smoke --format '{{(index .IPAM.Config 0).Gateway}}')"
          start(){ docker run -d --name aep-smoke --network aep-smoke --cap-drop DAC_OVERRIDE --env "AGENT_EXECUTION_PLANE_INGRESS_PROXY_IP=${gateway}" --env AGENT_EXECUTION_PLANE_PUBLIC_TRANSPORT=http -p 127.0.0.1:18098:8098 -p 127.0.0.1:18099:8099 -v "${root}/data:/data" "agent-execution-plane:${version}" >/dev/null; }
          wait_ready(){ for attempt in {1..60}; do if curl -fsS http://127.0.0.1:18098/health/ready | jq -e '.status=="ready"' >/dev/null && curl -fsS -H 'X-Ingress-Path: /api/hassio_ingress/ci' http://127.0.0.1:18099/health/ready | jq -e '.status=="ready"' >/dev/null; then return; fi; sleep 1; done; return 1; }
          start; wait_ready
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18098/)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18098/admin/api/v1/standalone)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"objective":"smoke","input":{},"mcp":{"url":"http://127.0.0.1:9/mcp","tools":[]}}' http://127.0.0.1:18098/api/v1/execute)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18099/)" = 403
          curl -fsS -D "${root}/headers" -o "${root}/page" -H 'X-Ingress-Path: /api/hassio_ingress/ci' http://127.0.0.1:18099/
          page="$(cat "${root}/page")"
          csrf="$(sed -n 's/^set-cookie: aep_csrf=\([^;]*\).*/\1/ip' "${root}/headers")"; test -n "${csrf}"
          [[ "${page}" == *"Agent Execution Plane <b>v${version}</b>"* ]]
          [[ "${page}" == *'src="/api/hassio_ingress/ci/admin/assets/icon.png"'* ]]
          [[ "${page}" == *'href="#activity"'* ]]
          ui_js="$(curl -fsS -H 'X-Ingress-Path: /api/hassio_ingress/ci' http://127.0.0.1:18099/admin/assets/admin.js)"
          ui_css="$(curl -fsS -H 'X-Ingress-Path: /api/hassio_ingress/ci' http://127.0.0.1:18099/admin/assets/admin.css)"
          [[ "${ui_js}" == *"navigator.language"* && "${ui_js}" == *"aep-language"* && "${ui_js}" == *"aep-theme"* ]]
          [[ "${ui_js}" == *"Overview"* && "${ui_js}" == *"Vue d’ensemble"* && "${ui_js}" == *"Activity"* && "${ui_js}" == *"Activité"* && "${ui_js}" == *"Application stopped"* && "${ui_js}" == *"Application arrêtée"* ]]
          [[ "${ui_css}" == *"html[data-theme=dark]"* ]]
          credential="$(curl -fsS -X POST -H 'X-Ingress-Path: /api/hassio_ingress/ci' -H "Cookie: aep_csrf=${csrf}" -H "X-CSRF-Token: ${csrf}" http://127.0.0.1:18099/admin/api/v1/standalone/credential/create)"
          token="$(jq -r '.token' <<<"${credential}")"; test "${#token}" -ge 40
          standalone_state="$(curl -fsS -H 'X-Ingress-Path: /api/hassio_ingress/ci' http://127.0.0.1:18099/admin/api/v1/standalone)"
          jq -e '.credential_configured == true and (.token|not)' <<<"${standalone_state}" >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Authorization: Bearer wrong' -H 'Content-Type: application/json' --data '{"objective":"smoke","input":{},"mcp":{"url":"http://127.0.0.1:9/mcp","tools":[]}}' http://127.0.0.1:18098/api/v1/execute)" = 401
          accepted="$(curl -fsS -X POST -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' --data '{"objective":"smoke","input":{},"mcp":{"url":"http://127.0.0.1:9/mcp","tools":[]}}' http://127.0.0.1:18098/api/v1/execute)"
          execution_id="$(jq -r '.execution_id' <<<"${accepted}")"; test "$(jq -r '.status' <<<"${accepted}")" = accepted
          for attempt in {1..30}; do result="$(curl -fsS -H "Authorization: Bearer ${token}" "http://127.0.0.1:18098/api/v1/executions/${execution_id}")"; [ "$(jq -r '.status' <<<"${result}")" = result_available ] && break; sleep .2; done
          test "$(jq -r '.outcome.error_code' <<<"${result}")" = no_compatible_model
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' --data '{"objective":"blocked","input":null,"mcp":{"url":"http://127.0.0.1:9/mcp","tools":[]}}' http://127.0.0.1:18098/api/v1/execute)" = 409
          curl -fsS -H 'X-Ingress-Path: /api/hassio_ingress/ci' http://127.0.0.1:18099/admin/assets/icon.png -o /tmp/aep-icon.png
          cmp agent_execution_plane/icon.png /tmp/aep-icon.png
          curl -fsS -H 'X-Ingress-Path: /api/hassio_ingress/ci' 'http://127.0.0.1:18099/admin/api/v1/activity?limit=50' | jq -e '.total >= 2 and all(.entries[]; has("event_code") and (has("objective")|not) and (has("result")|not))'
          docker logs aep-smoke > /tmp/aep-container.log 2>&1
          grep -F 'WARNING: Standalone Execution API uses unencrypted HTTP' /tmp/aep-container.log
          grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}([+-][0-9]{2}:?[0-9]{2}|Z) \[Agent Execution Plane\] (INFO|ERROR):' /tmp/aep-container.log
          docker exec aep-smoke /bin/sh -c 'for process in /proc/[0-9]*; do readlink -f "${process}/exe" 2>/dev/null || true; done' > agent_execution_plane-apparmor-executables.txt
          docker stop -t 15 aep-smoke >/dev/null; docker rm aep-smoke >/dev/null
          start; wait_ready
          recovered="$(curl -fsS -H "Authorization: Bearer ${token}" "http://127.0.0.1:18098/api/v1/executions/${execution_id}")"
          test "${recovered}" = "${result}"
          curl -fsS -X POST -H "Authorization: Bearer ${token}" "http://127.0.0.1:18098/api/v1/executions/${execution_id}/ack" | jq -e '.status == "acknowledged"' >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token}" "http://127.0.0.1:18098/api/v1/executions/${execution_id}")" = 404
          curl -fsS -H 'X-Ingress-Path: /api/hassio_ingress/ci' 'http://127.0.0.1:18099/admin/api/v1/activity?limit=50' | jq -e '.total >= 5 and any(.entries[]; .event_code == "app_stopped" and .category == "system" and .status == "success")'
          docker exec aep-smoke su-exec agent-execution-plane:agent-execution-plane test -f /data/agent_execution_plane.db
          docker exec aep-smoke su-exec agent-execution-plane:agent-execution-plane test -f /data/private/provider-key
          test "$(docker exec aep-smoke su-exec agent-execution-plane:agent-execution-plane stat -c '%a' /data/private/provider-key)" = 600
          docker exec aep-smoke su-exec agent-execution-plane:agent-execution-plane test -f /data/private/codex-home/config.toml
          test "$(docker exec aep-smoke su-exec agent-execution-plane:agent-execution-plane stat -c '%a' /data/private/codex-home)" = 700
          test "$(docker exec aep-smoke su-exec agent-execution-plane:agent-execution-plane stat -c '%a' /data/private/codex-home/config.toml)" = 600
          docker exec aep-smoke su-exec agent-execution-plane:agent-execution-plane env PYTHONPATH=/app/src python3 -c 'from pathlib import Path; from agent_execution_plane.codex_runtime import CodexRuntime; runtime=CodexRuntime(Path("/data/private/codex-home")); runtime.smoke(); runtime.close()'
          curl -fsS -H 'X-Ingress-Path: /api/hassio_ingress/ci' http://127.0.0.1:18099/admin/api/v1/models | jq -e '.models == []'
      - name: Record Docker executable inventory (not HAOS AppArmor enforcement)
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' agent_execution_plane/config.yaml)"
          docker run --rm --entrypoint /bin/sh "agent-execution-plane:${version}" -c 'find /command /package -type f -perm /111 -print 2>/dev/null' >> agent_execution_plane-apparmor-executables.txt
          cat agent_execution_plane-codex-executables.txt >> agent_execution_plane-apparmor-executables.txt
          sort -u -o agent_execution_plane-apparmor-executables.txt agent_execution_plane-apparmor-executables.txt
          test -s agent_execution_plane-apparmor-executables.txt
          {
            echo '### Agent Execution Plane AppArmor evidence'
            echo
            echo 'The uploaded executable inventory is Docker build/runtime evidence only.'
            echo 'Docker CI does not apply or validate the Home Assistant OS AppArmor profile; real HAOS acceptance remains required.'
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v6
        with:
          name: agent-execution-plane-apparmor-executables
          path: agent_execution_plane-apparmor-executables.txt
          if-no-files-found: error
          retention-days: 7
