name: TMP AppArmor probe

on:
  push:
    branches:
      - feat/claude-remote-apparmor
    paths:
      - ".github/workflows/tmp-apparmor-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --build-arg BUILD_ARCH=amd64 --build-arg BUILD_VERSION=0.0.0 --tag cr claude_remote
      - name: Try profile variants
        run: |
          set -uo pipefail
          uname -r; apparmor_parser --version | head -1
          python3 - <<'PY'
          import pathlib, re
          src = pathlib.Path("claude_remote/apparmor.txt").read_text()
          def rename(text, name):
              return text.replace("profile claude_remote ", f"profile {name} ").replace("claude_remote//", f"{name}//")
          def drop(text, pattern):
              return re.sub(pattern, "", text, flags=re.MULTILINE)
          start = src.index("  profile claude flags")
          end = src.rindex("}")
          nochild = src[:start] + src[end:]
          nochild = nochild.replace("  /usr/local/bin/claude Cx -> claude,\n", "")
          variants = {
              "v_full": src,
              "v_nochild": nochild,
              "v_nounix": drop(src, r"^\s*(network unix|unix),\n"),
              "v_noptrace": drop(src, r"^\s*ptrace .*\n"),
              "v_nodeny": drop(src, r"^\s*deny (mount|umount|pivot_root),\n"),
              "v_nochild_nounix": drop(nochild, r"^\s*(network unix|unix),\n"),
          }
          for name, text in variants.items():
              pathlib.Path(f"/tmp/{name}.txt").write_text(rename(text, name))
          PY
          for v in v_full v_nochild v_nounix v_noptrace v_nodeny v_nochild_nounix; do
            sudo apparmor_parser --replace "/tmp/${v}.txt" || { echo "${v}: LOAD FAILED"; continue; }
            out="$(docker run --rm --security-opt "apparmor=${v}" --entrypoint /usr/bin/python3 cr \
              -c 'import socket; socket.socket(socket.AF_INET, socket.SOCK_STREAM); print("inet ok")' 2>&1 | tail -1)"
            echo "${v}: ${out}"
          done
          sudo dmesg | grep -F 'apparmor="DENIED"' | grep -F 'class="net"' | sed -E 's/.*profile="([^"]+)".*family="([^"]+)".*/\1 \2/' | sort | uniq -c
