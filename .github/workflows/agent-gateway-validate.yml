name: Validate Agent Gateway App

on:
  push:
    branches:
      - main
    paths:
      - "agent_gateway/**"
      - ".gitignore"
      - ".github/workflows/agent-gateway-validate.yml"
  pull_request:
    paths:
      - "agent_gateway/**"
      - ".gitignore"
      - ".github/workflows/agent-gateway-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate metadata and source
        run: |
          set -euo pipefail
          python3 agent_gateway/scripts/validate.py
          bash -n agent_gateway/run.sh
          python3 -m compileall -q \
            agent_gateway/src \
            agent_gateway/tests
          PYTHONPATH=agent_gateway/src \
            python3 -m unittest discover -s agent_gateway/tests -v

      - name: Build amd64 image
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' agent_gateway/config.yaml)"
          docker build --pull \
            --build-arg BUILD_ARCH=amd64 \
            --build-arg "BUILD_VERSION=${version}" \
            --tag "agent-gateway:${version}" \
            agent_gateway

      - name: Validate expected s6 service-definition inventory
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' agent_gateway/config.yaml)"
          docker run --rm --entrypoint /bin/sh "agent-gateway:${version}" -c '
            test "$(find /etc/s6-overlay/s6-rc.d -print | wc -l)" = 7
            test "$(find /etc/s6-overlay/s6-rc.d/user/contents.d -print | wc -l)" = 1
            test "$(find /etc/s6-overlay/s6-rc.d/user2/contents.d -print | wc -l)" = 1
            test "$(readlink -f /command/printcontenv)" = "/package/admin/s6-overlay-3.2.2.0/command/printcontenv"
          '

      - name: Validate packaged s6-rc source inventory
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' agent_gateway/config.yaml)"
          docker run --rm --entrypoint /bin/sh "agent-gateway:${version}" -c '
            root=/package/admin/s6-overlay-3.2.2.0/etc/s6-rc/sources
            test "$(find "${root}" -print | wc -l)" = 29
            test "$(find "${root}" -type d -print | wc -l)" = 10
            test "$(find "${root}" -type f -print | wc -l)" = 19
          '

      - name: Validate packaged s6-rc script inventory
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' agent_gateway/config.yaml)"
          docker run --rm --entrypoint /bin/sh "agent-gateway:${version}" -c '
            root=/package/admin/s6-overlay-3.2.2.0/etc/s6-rc/scripts
            test "$(find "${root}" -print | wc -l)" = 6
            test "$(find "${root}" -type d -print | wc -l)" = 1
            test "$(find "${root}" -type f -print | wc -l)" = 5
          '

      - name: Validate with-contenv path used by AppArmor
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' agent_gateway/config.yaml)"
          docker run --rm --entrypoint /bin/sh "agent-gateway:${version}" -c '
            test -L /usr/bin/with-contenv
            test "$(readlink -f /usr/bin/with-contenv)" = "/package/admin/s6-overlay-3.2.2.0/command/with-contenv"
          '

      - name: Validate su-exec path used by AppArmor
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' agent_gateway/config.yaml)"
          docker run --rm --entrypoint /bin/sh "agent-gateway:${version}" -c '
            test "$(command -v su-exec)" = "/sbin/su-exec"
            test -f /sbin/su-exec
            test ! -L /sbin/su-exec
          '

      - name: Smoke-test listener isolation and persistence
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' agent_gateway/config.yaml)"
          root="${RUNNER_TEMP}/agent-gateway-smoke"
          mkdir -p "${root}/data"

          cleanup() {
            docker logs agent-gateway-smoke 2>&1 || true
            docker rm --force agent-gateway-smoke >/dev/null 2>&1 || true
            docker network rm agent-gateway-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          wait_ready() {
            for attempt in {1..60}; do
              if curl --fail --silent http://127.0.0.1:18098/health/ready | jq -e '.status == "ready"' >/dev/null; then
                return 0
              fi
              sleep 1
            done
            docker inspect agent-gateway-smoke --format 'READINESS_FAILURE|status={{.State.Status}}|running={{.State.Running}}|exit={{.State.ExitCode}}|ports={{json .NetworkSettings.Ports}}'
            return 1
          }

          docker network create agent-gateway-smoke >/dev/null
          ingress_proxy_ip="$(docker network inspect agent-gateway-smoke --format '{{(index .IPAM.Config 0).Gateway}}')"
          docker run --detach \
            --name agent-gateway-smoke \
            --network agent-gateway-smoke \
          --cap-drop DAC_OVERRIDE \
          --env "AGENT_GATEWAY_INGRESS_PROXY_IP=${ingress_proxy_ip}" \
          --env "AGENT_GATEWAY_INTAKE_RATE_LIMIT=1" \
            --publish 127.0.0.1:18098:8098 \
            --publish 127.0.0.1:18099:8099 \
            --volume "${root}/data:/data" \
            "agent-gateway:${version}"

          wait_ready
          echo "SMOKE_STAGE=initial-ready"
          if docker logs agent-gateway-smoke 2>&1 | grep -q 'IncompleteFieldDefinitionWarning'; then
            echo 'Unexpected MCP/Pydantic settings warning' >&2
            exit 1
          fi
          ingress_page="$(curl --fail --silent \
            --header "X-Ingress-Path: /api/hassio_ingress/ci" \
            http://127.0.0.1:18099/)"
          [[ "${ingress_page}" == *"Agent Gateway"* ]]
          [[ "${ingress_page}" == *'href="/api/hassio_ingress/ci/health/ready"'* ]]
          [[ "${ingress_page}" == *'src="/api/hassio_ingress/ci/admin/assets/admin.js"'* ]]
          [[ "${ingress_page}" == *'src="/api/hassio_ingress/ci/admin/assets/logo.png"'* ]]
          [[ "${ingress_page}" == *'href="#audit"'* ]]
          test "$(curl --silent --output /tmp/agent-gateway-logo.png --write-out '%{http_code}' \
            --header "X-Ingress-Path: /api/hassio_ingress/ci" \
            http://127.0.0.1:18099/admin/assets/logo.png)" = "200"
          test "$(stat -c '%s' /tmp/agent-gateway-logo.png)" -gt 1000
          echo "SMOKE_STAGE=ingress-ready"
          public_root_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18098/)"
          echo "SMOKE_CHECK=public-root:${public_root_status}"
          test "${public_root_status}" = "404"
          docker exec agent-gateway-smoke \
            su-exec agent-gateway:agent-gateway \
            test -f /data/agent_gateway.db
          private_stat="$(docker exec agent-gateway-smoke su-exec agent-gateway:agent-gateway stat -c '%u:%g:%a' /data/private)"
          pepper_stat="$(docker exec agent-gateway-smoke su-exec agent-gateway:agent-gateway stat -c '%u:%g:%a' /data/private/credential-pepper)"
          runtime_gid="$(docker exec agent-gateway-smoke id -g agent-gateway)"
          echo "SMOKE_CHECK=private:${private_stat} pepper:${pepper_stat}"
          test "${private_stat}" = "1000:${runtime_gid}:700"
          test "${pepper_stat}" = "1000:${runtime_gid}:600"
          docker cp agent_gateway/tests/control_plane_smoke.py \
            agent-gateway-smoke:/tmp/control_plane_smoke.py
          docker exec --env PYTHONPATH=/app/src agent-gateway-smoke \
            su-exec agent-gateway:agent-gateway \
            python3 /tmp/control_plane_smoke.py
          echo "SMOKE_STAGE=database-api-ready"

          ingress_path="/api/hassio_ingress/ci"
          admin_page="$(curl --fail --silent \
            --header "X-Ingress-Path: ${ingress_path}" \
            http://127.0.0.1:18099/)"
          csrf_token="$(printf '%s' "${admin_page}" | sed -n 's/.*data-csrf="\([^"]*\)".*/\1/p')"
          test -n "${csrf_token}"
          identity_response="$(curl --fail --silent \
            --request POST \
            --header "X-Ingress-Path: ${ingress_path}" \
            --header "X-CSRF-Token: ${csrf_token}" \
            --header "Cookie: agw_csrf=${csrf_token}" \
            --header "Content-Type: application/json" \
            --data '{"display_name":"CI API source","identity_type":"event_source","actions":["events.create","permissions.effective.read"]}' \
            http://127.0.0.1:18099/admin/api/v1/identities)"
          credential="$(printf '%s' "${identity_response}" | jq -er '.credential')"
          echo "SMOKE_STAGE=identity-ready"
          curl --fail --silent \
            --header "X-Ingress-Path: ${ingress_path}" \
            http://127.0.0.1:18099/admin/api/v1/identities | \
            jq -e '.identities | length == 4 and all(has("credential") | not)'
          occurred_at="$(date --utc +'%Y-%m-%dT%H:%M:%SZ')"
          event_payload="$(jq --null-input --compact-output \
            --arg occurred_at "${occurred_at}" \
            '{schema_version:1,event_type:"gatus.endpoint_unavailable",occurred_at:$occurred_at,source:"home_assistant",subject:{entity_id:"binary_sensor.ci_api_connectivity"},attributes:{state:"off"},requested_task:"gatus_readonly_diagnostic"}')"
          test "$(curl --silent --output /tmp/event-first.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${credential}" \
            --header "Idempotency-Key: ci-api-stable-key" \
            --header "Content-Type: application/json" \
            --data "${event_payload}" \
            http://127.0.0.1:18098/api/v1/events)" = "202"
          test "$(curl --silent --output /tmp/event-replay.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${credential}" \
            --header "Idempotency-Key: ci-api-stable-key" \
            --header "Content-Type: application/json" \
            --data "${event_payload}" \
            http://127.0.0.1:18098/api/v1/events)" = "200"
          test "$(jq -r '.event_id' /tmp/event-first.json)" = "$(jq -r '.event_id' /tmp/event-replay.json)"
          test "$(curl --silent --dump-header /tmp/rate-limit-headers.txt \
            --output /tmp/rate-limit.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${credential}" \
            --header "Idempotency-Key: ci-api-second-key" \
            --header "Content-Type: application/json" \
            --data "${event_payload}" \
            http://127.0.0.1:18098/api/v1/events)" = "429"
          jq -e '.error.code == "rate_limited"' /tmp/rate-limit.json
          grep -qi '^retry-after: 60' /tmp/rate-limit-headers.txt
          curl --fail --silent \
            --header "X-Ingress-Path: ${ingress_path}" \
            http://127.0.0.1:18099/admin/api/v1/events | \
            jq -e '.events | length == 3 and all(has("credential") | not)'
          curl --fail --silent \
            --header "X-Ingress-Path: ${ingress_path}" \
            http://127.0.0.1:18099/admin/api/v1/jobs | \
            jq -e '.jobs | length == 3 and any(.state == "queued") and any(.state == "completed") and any(.state == "dead_letter")'
          curl --fail --silent \
            --header "X-Ingress-Path: ${ingress_path}" \
            http://127.0.0.1:18099/admin/api/v1/reports | \
            jq -e '.reports | length == 1'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${credential}" \
            http://127.0.0.1:18098/api/v1/events)" = "403"
          observer_response="$(curl --fail --silent \
            --request POST \
            --header "X-Ingress-Path: ${ingress_path}" \
            --header "X-CSRF-Token: ${csrf_token}" \
            --header "Cookie: agw_csrf=${csrf_token}" \
            --header "Content-Type: application/json" \
            --data '{"display_name":"CI observer","identity_type":"client","actions":["gateway.status.read","permissions.effective.read","events.read","jobs.read","reports.read"]}' \
            http://127.0.0.1:18099/admin/api/v1/identities)"
          observer_credential="$(printf '%s' "${observer_response}" | jq -er '.credential')"
          curl --fail --silent --header "Authorization: Bearer ${observer_credential}" \
            http://127.0.0.1:18098/api/v1/events | jq -e '.events | length == 3'
          curl --fail --silent --header "Authorization: Bearer ${observer_credential}" \
            http://127.0.0.1:18098/api/v1/jobs | jq -e '.jobs | length == 3'
          curl --fail --silent --header "Authorization: Bearer ${observer_credential}" \
            http://127.0.0.1:18098/api/v1/reports | jq -e '.reports | length == 1'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            http://127.0.0.1:18098/mcp)" = "401"
          curl --fail --silent --request POST \
            --header "Authorization: Bearer ${observer_credential}" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            http://127.0.0.1:18098/mcp | jq -e '.result.serverInfo.name == "Agent Gateway"'
          curl --fail --silent --request POST \
            --header "Authorization: Bearer ${observer_credential}" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            http://127.0.0.1:18098/mcp | jq -e '.result.tools | map(.name) == ["gateway_status_v1","permissions_get_effective_v1","events_list_v1","events_get_v1","jobs_list_v1","jobs_get_v1","reports_list_v1","reports_get_v1"]'
          curl --fail --silent --request POST \
            --header "Authorization: Bearer ${observer_credential}" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"gateway_status_v1","arguments":{}}}' \
            http://127.0.0.1:18098/mcp | jq -e '.result.structuredContent.status == "ready"'
          event_id="$(jq -er '.event_id' /tmp/event-first.json)"
          job_id="$(jq -er '.job_id' /tmp/event-first.json)"
          curl --fail --silent --request POST \
            --header "Authorization: Bearer ${observer_credential}" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data "$(jq --null-input --compact-output --arg event_id "${event_id}" '{jsonrpc:"2.0",id:4,method:"tools/call",params:{name:"events_get_v1",arguments:{event_id:$event_id}}}')" \
            http://127.0.0.1:18098/mcp | jq -e --arg event_id "${event_id}" '.result.structuredContent.event.id == $event_id'
          curl --fail --silent --request POST \
            --header "Authorization: Bearer ${observer_credential}" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data "$(jq --null-input --compact-output --arg job_id "${job_id}" '{jsonrpc:"2.0",id:5,method:"tools/call",params:{name:"jobs_get_v1",arguments:{job_id:$job_id}}}')" \
            http://127.0.0.1:18098/mcp | jq -e --arg job_id "${job_id}" '.result.structuredContent.job.id == $job_id'
          curl --fail --silent --request POST \
            --header "Authorization: Bearer ${credential}" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":6,"method":"tools/list","params":{}}' \
            http://127.0.0.1:18098/mcp | jq -e '.result.tools | map(.name) == ["permissions_get_effective_v1"]'
          worker_response="$(curl --fail --silent \
            --request POST \
            --header "X-Ingress-Path: ${ingress_path}" \
            --header "X-CSRF-Token: ${csrf_token}" \
            --header "Cookie: agw_csrf=${csrf_token}" \
            --header "Content-Type: application/json" \
            --data '{"display_name":"CI MCP worker","identity_type":"client","actions":["jobs.claim","jobs.heartbeat","jobs.complete","jobs.fail"]}' \
            http://127.0.0.1:18099/admin/api/v1/identities)"
          worker_credential="$(printf '%s' "${worker_response}" | jq -er '.credential')"
          curl --fail --silent --request POST \
            --header "Authorization: Bearer ${worker_credential}" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":7,"method":"tools/list","params":{}}' \
            http://127.0.0.1:18098/mcp | jq -e '.result.tools | map(.name) == ["jobs_claim_v1","jobs_heartbeat_v1","jobs_complete_v1","jobs_fail_v1"]'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "X-Ingress-Path: ${ingress_path}" \
            --header "Content-Type: application/json" \
            --data "{\"job_id\":\"${job_id}\"}" \
            http://127.0.0.1:18099/admin/api/v1/jobs/cancel)" = "403"
          curl --fail --silent --request POST \
            --header "X-Ingress-Path: ${ingress_path}" \
            --header "X-CSRF-Token: ${csrf_token}" \
            --header "Cookie: agw_csrf=${csrf_token}" \
            --header "Content-Type: application/json" \
            --data "{\"job_id\":\"${job_id}\"}" \
            http://127.0.0.1:18099/admin/api/v1/jobs/cancel | \
            jq -e --arg job_id "${job_id}" '.job_id == $job_id and .state == "cancelled"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "X-Ingress-Path: ${ingress_path}" \
            --header "X-CSRF-Token: ${csrf_token}" \
            --header "Cookie: agw_csrf=${csrf_token}" \
            --header "Content-Type: application/json" \
            --data "{\"job_id\":\"${job_id}\"}" \
            http://127.0.0.1:18099/admin/api/v1/jobs/cancel)" = "409"
          curl --fail --silent \
            --header "X-Ingress-Path: ${ingress_path}" \
            http://127.0.0.1:18099/admin/api/v1/jobs | \
            jq -e --arg job_id "${job_id}" 'any(.jobs[]; .id == $job_id and .state == "cancelled")'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --data "{\"job_id\":\"${job_id}\"}" \
            http://127.0.0.1:18098/admin/api/v1/jobs/cancel)" = "404"
          curl --fail --silent \
            --header "Authorization: Bearer ${credential}" \
            http://127.0.0.1:18098/api/v1/permissions/effective | \
            jq -e '.gateway_actions | index("events.create")'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18098/api/v1/permissions/effective)" = "401"
          docker exec --env PYTHONPATH=/app/src agent-gateway-smoke \
            su-exec agent-gateway:agent-gateway \
            python3 -c 'import sqlite3; connection=sqlite3.connect("/data/agent_gateway.db"); assert connection.execute("SELECT count(*) FROM audit_entries WHERE decision=\"denied\"").fetchone()[0] >= 1'
          curl --fail --silent \
            --header "X-Ingress-Path: ${ingress_path}" \
            http://127.0.0.1:18099/admin/api/v1/audit | \
            jq -e '.limit == 200 and (.audit_entries | length >= 4 and any(.decision == "denied") and all(has("credential_id") | not))'
          curl --fail --silent \
            --header "X-Ingress-Path: ${ingress_path}" \
            http://127.0.0.1:18099/admin/api/v1/audit/export \
            --output /tmp/agent-gateway-audit.jsonl
          test "$(wc -l </tmp/agent-gateway-audit.jsonl)" -ge 4
          jq -e '.schema_version == 1 and (.audit_entry.entry_hash | length == 64) and (.audit_entry | has("credential_id") | not)' /tmp/agent-gateway-audit.jsonl >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18098/admin/api/v1/audit)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18099/admin/api/v1/status)" = "403"
          echo "SMOKE_STAGE=api-ready"

          initial_pid="$(docker inspect agent-gateway-smoke --format '{{.State.Pid}}')"
          docker restart agent-gateway-smoke >/dev/null
          for attempt in {1..30}; do
            restarted_pid="$(docker inspect agent-gateway-smoke --format '{{.State.Pid}}')"
            if [[ "${restarted_pid}" != "0" && "${restarted_pid}" != "${initial_pid}" ]]; then
              break
            fi
            sleep 1
          done
          test "${restarted_pid}" != "${initial_pid}"
          wait_ready
          echo "SMOKE_STAGE=restart-ready"
          curl --fail --silent \
            --header "Authorization: Bearer ${credential}" \
            http://127.0.0.1:18098/api/v1/permissions/effective | \
            jq -e '.gateway_actions | index("events.create")'
          identity_id="$(printf '%s' "${identity_response}" | jq -er '.identity_id')"
          admin_page="$(curl --fail --silent \
            --header "X-Ingress-Path: ${ingress_path}" \
            http://127.0.0.1:18099/)"
          csrf_token="$(printf '%s' "${admin_page}" | sed -n 's/.*data-csrf="\([^"]*\)".*/\1/p')"
          curl --fail --silent \
            --request POST \
            --header "X-Ingress-Path: ${ingress_path}" \
            --header "X-CSRF-Token: ${csrf_token}" \
            --header "Cookie: agw_csrf=${csrf_token}" \
            --header "Content-Type: application/json" \
            --data "{\"identity_id\":\"${identity_id}\"}" \
            http://127.0.0.1:18099/admin/api/v1/identities/revoke | \
            jq -e '.status == "revoked"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${credential}" \
            http://127.0.0.1:18098/api/v1/permissions/effective)" = "401"
