name: Validate MCP Capability Bridge App

on:
  push:
    branches: [main]
    paths: ["mcp_capability_bridge/**", ".github/workflows/mcp-capability-bridge-validate.yml"]
  pull_request:
    paths: ["mcp_capability_bridge/**", ".github/workflows/mcp-capability-bridge-validate.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Validate metadata, source, and tests
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --requirement mcp_capability_bridge/requirements.txt
          python3 mcp_capability_bridge/scripts/validate.py
          bash -n mcp_capability_bridge/run.sh
          python3 -m compileall -q mcp_capability_bridge/src mcp_capability_bridge/tests
          PYTHONPATH=mcp_capability_bridge/src python3 -m unittest discover -s mcp_capability_bridge/tests -v
          PYTHONPATH=agent_control_plane/src:mcp_capability_bridge/src:mcp_capability_bridge/tests python3 mcp_capability_bridge/tests/acp_pin_integration.py PinnedAcpContractIntegrationTests.test_current_acp_rejects_wrong_pin_and_recovers -v
      - name: Build amd64 image with base provenance
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' mcp_capability_bridge/config.yaml)"
          docker pull ghcr.io/home-assistant/base:latest
          base_reference="$(docker image inspect ghcr.io/home-assistant/base:latest --format '{{index .RepoDigests 0}}')"
          base_digest="${base_reference##*@}"
          test -n "${base_digest}"
          docker build \
            --build-arg BUILD_ARCH=amd64 \
            --build-arg "BUILD_VERSION=${version}" \
            --build-arg "BASE_IMAGE_DIGEST=${base_digest}" \
            --tag "mcp-capability-bridge:${version}" \
            mcp_capability_bridge
          test "$(docker image inspect "mcp-capability-bridge:${version}" --format '{{index .Config.Labels "org.opencontainers.image.base.digest"}}')" = "${base_digest}"
      - name: Validate browser executable inventory and unprivileged launch
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' mcp_capability_bridge/config.yaml)"
          docker run --rm --entrypoint python3 \
            -v "${PWD}/mcp_capability_bridge/scripts/validate_browser_inventory.py:/tmp/validate_browser_inventory.py:ro" \
            "mcp-capability-bridge:${version}" /tmp/validate_browser_inventory.py inventory > mcp-capability-bridge-browser-executables.txt
          python3 mcp_capability_bridge/scripts/validate_browser_inventory.py validate mcp-capability-bridge-browser-executables.txt mcp_capability_bridge/apparmor.txt
          docker run --rm --user 1000 --cap-drop ALL --security-opt no-new-privileges --shm-size 64m \
            --env HOME=/tmp --env PYTHONPATH=/app/src --entrypoint python3 "mcp-capability-bridge:${version}" -c \
            'from mcp_capability_bridge.browser_runtime import BrowserRuntime; from mcp_capability_bridge.web_adapter import NetworkPolicy; from pathlib import Path; from http.server import BaseHTTPRequestHandler,ThreadingHTTPServer; import tempfile,threading; H=type("H",(BaseHTTPRequestHandler,),{"do_GET":lambda s:(s.send_response(200),s.end_headers(),s.wfile.write(b"<title>ok</title>")),"log_message":lambda *a:None}); server=ThreadingHTTPServer(("127.0.0.1",0),H); threading.Thread(target=server.serve_forever,daemon=True).start(); url=f"http://127.0.0.1:{server.server_port}"; c={"base_url":url,"resolved_addresses":["127.0.0.1"],"navigation_origins":[url],"authentication_origins":[],"resource_origins":[url],"websocket_origins":[],"verify_tls":True,"inactivity_seconds":300,"absolute_seconds":1800}; r=BrowserRuntime(Path(tempfile.mkdtemp())); assert r._probe_sync(c,NetworkPolicy(c))["status"]=="reachable"; server.shutdown()'
      - name: Run browser contract tests in the built image
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' mcp_capability_bridge/config.yaml)"
          docker run --rm --shm-size 256m --entrypoint python3 \
            --env PYTHONPATH=/app/src --env MCB_RUN_BROWSER_TESTS=1 \
            --volume "${PWD}/mcp_capability_bridge/tests:/tests:ro" \
            "mcp-capability-bridge:${version}" -m unittest discover -s /tests -p test_web_interactive.py -v
      - name: Smoke-test topology, isolation, UI, restart, and shutdown
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' mcp_capability_bridge/config.yaml)"
          root="${RUNNER_TEMP}/mcb-smoke"
          mkdir -p "${root}/data"
          cleanup(){ docker logs mcb-smoke 2>&1 || true; docker rm -f mcb-smoke >/dev/null 2>&1 || true; docker network rm mcb-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker network create mcb-smoke >/dev/null
          gateway="$(docker network inspect mcb-smoke --format '{{(index .IPAM.Config 0).Gateway}}')"
          start(){ docker run -d --name mcb-smoke --network mcb-smoke --cap-drop DAC_OVERRIDE --env "MCP_CAPABILITY_BRIDGE_INGRESS_PROXY_IP=${gateway}" --env MCP_CAPABILITY_BRIDGE_PUBLIC_TRANSPORT=http -p 127.0.0.1:18098:8098 -p 127.0.0.1:18099:8099 -v "${root}/data:/data" "mcp-capability-bridge:${version}" >/dev/null; }
          wait_ready(){ for attempt in {1..60}; do if curl -fsS http://127.0.0.1:18098/health/ready | jq -e '.status=="ready"' >/dev/null && curl -fsS -H 'X-Ingress-Path: /api/hassio_ingress/ci' http://127.0.0.1:18099/health/ready | jq -e '.status=="ready"' >/dev/null; then return; fi; sleep 1; done; return 1; }
          start
          wait_ready
          docker logs mcb-smoke 2>&1 | grep -F 'WARNING' | grep -F 'unencrypted HTTP'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18098/)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18098/mcp)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18098/admin/api/v1/status)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18099/)" = 403
          curl -fsS -D "${root}/headers" -o "${root}/page" -H 'X-Ingress-Path: /api/hassio_ingress/ci' http://127.0.0.1:18099/
          page="$(cat "${root}/page")"
          csrf="$(sed -n 's/^set-cookie: mcb_csrf=\([^;]*\).*/\1/ip' "${root}/headers")"
          test -n "${csrf}"
          [[ "${page}" == *"MCP Capability Bridge <b>v${version}</b>"* ]]
          [[ "${page}" == *'src="/api/hassio_ingress/ci/admin/assets/icon.png"'* ]]
          curl -fsS -H 'X-Ingress-Path: /api/hassio_ingress/ci' http://127.0.0.1:18099/admin/api/v1/status | jq -e '.status=="ready" and .database_generation==1 and .public_surface=="authenticated_mcp" and (.adapters|map(.type_key)|sort)==["ssh","web"]' >/dev/null
          first="$(curl -fsS -X POST -H 'X-Ingress-Path: /api/hassio_ingress/ci' -H "Cookie: mcb_csrf=${csrf}" -H "X-CSRF-Token: ${csrf}" -H 'Content-Type: application/json' --data '{"key":"ci_first","display_name":"CI first"}' http://127.0.0.1:18099/admin/api/v1/namespaces)"
          first_id="$(jq -r '.namespace.id' <<<"${first}")"
          first_token="$(jq -r '.token' <<<"${first}")"
          second="$(curl -fsS -X POST -H 'X-Ingress-Path: /api/hassio_ingress/ci' -H "Cookie: mcb_csrf=${csrf}" -H "X-CSRF-Token: ${csrf}" -H 'Content-Type: application/json' --data '{"key":"ci_second","display_name":"CI second"}' http://127.0.0.1:18099/admin/api/v1/namespaces)"
          second_token="$(jq -r '.token' <<<"${second}")"
          listed="$(curl -fsS -H 'X-Ingress-Path: /api/hassio_ingress/ci' http://127.0.0.1:18099/admin/api/v1/namespaces)"
          [[ "${listed}" != *"${first_token}"* && "${listed}" != *"${second_token}"* && "${listed}" != *credential_verifier* ]]
          PYTHONPATH=agent_control_plane/src python3 -c 'import asyncio,sys; from agent_control_plane.connectors import discover_streamable_http; tools=asyncio.run(discover_streamable_http("http://127.0.0.1:18098/mcp",sys.argv[1])); assert tools == []' "${first_token}"
          rotated="$(curl -fsS -X POST -H 'X-Ingress-Path: /api/hassio_ingress/ci' -H "Cookie: mcb_csrf=${csrf}" -H "X-CSRF-Token: ${csrf}" -H 'Content-Type: application/json' --data "{\"id\":\"${first_id}\"}" http://127.0.0.1:18099/admin/api/v1/namespaces/rotate)"
          rotated_token="$(jq -r '.token' <<<"${rotated}")"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${first_token}" http://127.0.0.1:18098/mcp)" = 401
          PYTHONPATH=agent_control_plane/src python3 -c 'import asyncio,sys; from agent_control_plane.connectors import discover_streamable_http; assert asyncio.run(discover_streamable_http("http://127.0.0.1:18098/mcp",sys.argv[1])) == []' "${rotated_token}"
          curl -fsS -X POST -H 'X-Ingress-Path: /api/hassio_ingress/ci' -H "Cookie: mcb_csrf=${csrf}" -H "X-CSRF-Token: ${csrf}" -H 'Content-Type: application/json' --data "{\"id\":\"${first_id}\"}" http://127.0.0.1:18099/admin/api/v1/namespaces/revoke | jq -e '.status=="revoked"' >/dev/null
          curl -fsS -X POST -H 'X-Ingress-Path: /api/hassio_ingress/ci' -H "Cookie: mcb_csrf=${csrf}" -H "X-CSRF-Token: ${csrf}" -H 'Content-Type: application/json' --data "{\"id\":\"${first_id}\"}" http://127.0.0.1:18099/admin/api/v1/namespaces/archive | jq -e '.status=="archived"' >/dev/null
          curl -fsS -H 'X-Ingress-Path: /api/hassio_ingress/ci' http://127.0.0.1:18099/admin/api/v1/namespaces | jq -e 'all(.namespaces[]; .key!="ci_first")' >/dev/null
          curl -fsS -H 'X-Ingress-Path: /api/hassio_ingress/ci' 'http://127.0.0.1:18099/admin/api/v1/namespaces?include_archived=true' | jq -e 'any(.namespaces[]; .key=="ci_first" and .status=="archived")' >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${rotated_token}" http://127.0.0.1:18098/mcp)" = 401
          ! grep -aF "${first_token}" "${root}/data/mcp_capability_bridge.db"
          ! grep -aF "${second_token}" "${root}/data/mcp_capability_bridge.db"
          css="$(curl -fsS -H 'X-Ingress-Path: /api/hassio_ingress/ci' http://127.0.0.1:18099/admin/assets/admin.css)"
          js="$(curl -fsS -H 'X-Ingress-Path: /api/hassio_ingress/ci' http://127.0.0.1:18099/admin/assets/admin.js)"
          [[ "${css}" == *'scrollbar-gutter:stable'* && "${css}" == *'html[data-theme=dark]'* ]]
          [[ "${js}" == *'navigator.language'* && "${js}" == *'Vue d’ensemble'* && "${js}" == *'Overview'* && "${js}" == *"e.key==='Escape'"* ]]
          python_processes="$(docker exec mcb-smoke /bin/sh -c 'for process in /proc/[0-9]*; do command="$(tr "\0" " " < "${process}/cmdline" 2>/dev/null || true)"; case "${command}" in "python3 -m mcp_capability_bridge.runtime "*) echo "${command}";; esac; done')"
          test "$(printf '%s\n' "${python_processes}" | sed '/^$/d' | wc -l)" = 1
          test "$(docker exec mcb-smoke /bin/sh -c 'for process in /proc/[0-9]*; do command="$(tr "\0" " " < "${process}/cmdline" 2>/dev/null || true)"; case "${command}" in "python3 -m mcp_capability_bridge.runtime "*) stat -c %u "${process}";; esac; done')" = 1000
          docker exec mcb-smoke su-exec mcp-capability-bridge:mcp-capability-bridge test -f /data/mcp_capability_bridge.db
          test "$(docker exec mcb-smoke su-exec mcp-capability-bridge:mcp-capability-bridge stat -c '%a' /data/private/credential-pepper)" = 600
          test "$(docker exec mcb-smoke su-exec mcp-capability-bridge:mcp-capability-bridge stat -c '%a' /data/private/target-secret-key)" = 600
          docker exec mcb-smoke /bin/sh -c 'for process in /proc/[0-9]*; do readlink -f "${process}/exe" 2>/dev/null || true; done' > mcp-capability-bridge-apparmor-executables.txt
          python3 mcp_capability_bridge/scripts/validate_apparmor_inventory.py mcp_capability_bridge/apparmor.txt mcp-capability-bridge-apparmor-executables.txt
          curl -fsS -H 'X-Ingress-Path: /api/hassio_ingress/ci' http://127.0.0.1:18099/admin/api/v1/activity | jq -e 'any(.events[]; .event=="app_started")' >/dev/null
          docker stop -t 15 mcb-smoke >/dev/null
          docker rm mcb-smoke >/dev/null
          sudo cp -a "${root}/data" "${root}/backup"
          sudo rm -rf "${root}/data"
          sudo cp -a "${root}/backup" "${root}/data"
          start
          wait_ready
          PYTHONPATH=agent_control_plane/src python3 -c 'import asyncio,sys; from agent_control_plane.connectors import discover_streamable_http; assert asyncio.run(discover_streamable_http("http://127.0.0.1:18098/mcp",sys.argv[1])) == []' "${second_token}"
          curl -fsS -H 'X-Ingress-Path: /api/hassio_ingress/ci' http://127.0.0.1:18099/admin/api/v1/activity | jq -e '[.events[] | select(.event=="app_started")] | length >= 2' >/dev/null
          curl -fsS -H 'X-Ingress-Path: /api/hassio_ingress/ci' http://127.0.0.1:18099/admin/api/v1/status | jq -e '.runtime.active_sessions==0 and .runtime.active_operations==0' >/dev/null
          docker stop -t 15 mcb-smoke >/dev/null
      - name: Record image executable inventory
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' mcp_capability_bridge/config.yaml)"
          docker run --rm --entrypoint /bin/sh "mcp-capability-bridge:${version}" -c 'find /command /package -type f -perm /111 -print 2>/dev/null' >> mcp-capability-bridge-apparmor-executables.txt
          sort -u -o mcp-capability-bridge-apparmor-executables.txt mcp-capability-bridge-apparmor-executables.txt
          test -s mcp-capability-bridge-apparmor-executables.txt
          cat mcp-capability-bridge-apparmor-executables.txt
          {
            echo '### MCP Capability Bridge AppArmor evidence'
            echo
            echo 'This executable inventory is Docker evidence. Final AppArmor enforcement remains part of real HAOS acceptance.'
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v6
        with:
          name: mcp-capability-bridge-apparmor-executables
          path: |
            mcp-capability-bridge-apparmor-executables.txt
            mcp-capability-bridge-browser-executables.txt
          if-no-files-found: error
          retention-days: 7
