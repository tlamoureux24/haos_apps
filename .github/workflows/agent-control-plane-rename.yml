name: Apply Agent Control Plane rename

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent-control-plane-rename.yml"

permissions:
  contents: write

jobs:
  apply-rename:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Apply complete rename
        shell: bash
        run: |
          set -euo pipefail

          git mv agent_gateway agent_control_plane
          git mv agent_control_plane/src/agent_gateway agent_control_plane/src/agent_control_plane
          git mv .github/workflows/agent-gateway-validate.yml .github/workflows/agent-control-plane-validate.yml

          python3 - <<'PY'
          from pathlib import Path
          import re

          replacements = (
              ("AGENT_GATEWAY", "AGENT_CONTROL_PLANE"),
              ("AgentGateway", "AgentControlPlane"),
              ("agentGateway", "agentControlPlane"),
              ("Agent-Gateway", "Agent-Control-Plane"),
              ("X-Agent-Gateway", "X-Agent-Control-Plane"),
              ("agent_gateway", "agent_control_plane"),
              ("agent-gateway", "agent-control-plane"),
              ("Agent Gateway", "Agent Control Plane"),
              ("gateway.status.read", "control_plane.status.read"),
              ("gateway_status_v1", "control_plane_status_v1"),
              ("gateway_status", "control_plane_status"),
              ("gateway_actions", "control_plane_actions"),
              ("gateway_metadata", "control_plane_metadata"),
              ("gateway.db", "control_plane.db"),
              ("gateway-action", "control-plane-action"),
              ("gateway actions", "control-plane actions"),
              ("gateway permissions", "control-plane permissions"),
              ("Gateway permissions", "Control Plane permissions"),
              ("replaces_gateway_copy", "replaces_control_plane_copy"),
              ("Return the gateway version", "Return the control plane version"),
              ("deny-by-default gateway policy", "deny-by-default control-plane policy"),
              ("Read the governed gateway status.", "Read the governed control-plane status."),
              ("agw_", "acp_"),
              ("agw-", "acp-"),
          )

          for path in sorted(Path(".").rglob("*")):
              if not path.is_file() or ".git" in path.parts:
                  continue
              data = path.read_bytes()
              if b"\x00" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          config = Path("agent_control_plane/config.yaml")
          text = config.read_text(encoding="utf-8")
          old_description = 'description: "Governed automation gateway for MCP-compatible agents"'
          new_description = 'description: "Governed control plane for MCP-compatible agents"'
          if old_description not in text:
              raise SystemExit("expected App description not found")
          config.write_text(text.replace(old_description, new_description, 1), encoding="utf-8")

          root_readme = Path("README.md")
          text = root_readme.read_text(encoding="utf-8")
          text = text.replace(
              "Passerelle stable entre des agents authentifiés et un ou plusieurs\nserveurs MCP configurables.",
              "Plan de contrôle stable entre des agents authentifiés et un ou plusieurs\nserveurs MCP configurables.",
              1,
          )
          text = text.replace(
              "Stable gateway between authenticated agents and one or more configurable\nMCP servers.",
              "Stable control plane between authenticated agents and one or more configurable\nMCP servers.",
              1,
          )
          root_readme.write_text(text, encoding="utf-8")

          changelog = Path("agent_control_plane/CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "## 0.46.8\n\n"
          note = (
              "- Finalize the pre-production product and Home Assistant App identity as "
              "Agent Control Plane before persistent production configuration begins; no "
              "user-data migration is required at this cutoff.\n"
          )
          if marker not in text:
              raise SystemExit("0.46.8 changelog marker not found")
          if note not in text:
              text = text.replace(marker, marker + note, 1)
          changelog.write_text(text, encoding="utf-8")

          main = Path("agent_control_plane/src/agent_control_plane/main.py")
          text = main.read_text(encoding="utf-8")
          subtitle = "<small>Control plane</small>"
          if text.count(subtitle) != 1:
              raise SystemExit(f"expected exactly one header subtitle, found {text.count(subtitle)}")
          main.write_text(text.replace(subtitle, "", 1), encoding="utf-8")

          ui = Path("agent_control_plane/src/agent_control_plane/admin_ui.py")
          text = ui.read_text(encoding="utf-8")
          text, css_count = re.subn(r"\.brand small\{[^}]*\}", "", text, count=1)
          if css_count != 1:
              raise SystemExit("brand subtitle CSS rule not found exactly once")
          ui.write_text(text, encoding="utf-8")

          ui_replacements = {
              "Gérez les identités et leurs autorisations d’accès à la passerelle.": "Gérez les identités et leurs autorisations d’accès au plan de contrôle.",
              "Permissions de la passerelle": "Permissions du plan de contrôle",
              "Consultez l’état opérationnel de la passerelle.": "Consultez l’état opérationnel du plan de contrôle.",
              "Derniers événements authentifiés reçus par la passerelle.": "Derniers événements authentifiés reçus par le plan de contrôle.",
              "File persistante des travaux demandés à la passerelle.": "File persistante des travaux demandés au plan de contrôle.",
              "Reçus par la passerelle": "Reçus par le plan de contrôle",
              "Manage identities and their gateway access permissions.": "Manage identities and their Control Plane access permissions.",
              "Review the gateway operational state.": "Review the Control Plane operational state.",
              "Latest authenticated events received by the gateway.": "Latest authenticated events received by the Control Plane.",
              "Persistent queue of work requested from the gateway.": "Persistent queue of work requested from the Control Plane.",
              "Received by the gateway": "Received by the Control Plane",
              "L’ancien secret ne sera plus stocké ni utilisé par la Gateway.": "L’ancien secret ne sera plus stocké ni utilisé par Agent Control Plane.",
              "The old secret will no longer be stored or used by the Gateway.": "The old secret will no longer be stored or used by Agent Control Plane.",
          }
          for path in (main, ui):
              text = path.read_text(encoding="utf-8")
              for old, new in ui_replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY

          git diff --check

          if grep -RInEi --exclude='*.png' --exclude-dir=.git \
            'agent[ _-]?gateway|AGENT_GATEWAY|AgentGateway|agw[-_]' .; then
            echo "Old Agent Gateway identity still present"
            exit 1
          fi

          if grep -RInE --exclude='*.png' --exclude-dir=.git \
            'gateway_status|gateway_actions|gateway_metadata|gateway\.status\.read|gateway\.db' \
            agent_control_plane README.md .github/workflows/agent-control-plane-validate.yml; then
            echo "Old gateway contract identity still present"
            exit 1
          fi

      - name: Validate renamed metadata and source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            --requirement agent_control_plane/requirements.txt
          python3 agent_control_plane/scripts/validate.py
          bash -n agent_control_plane/run.sh
          python3 -m compileall -q agent_control_plane/src agent_control_plane/tests
          PYTHONPATH=agent_control_plane/src \
            python3 -m unittest discover -s agent_control_plane/tests -v

      - name: Commit rename atomically
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-control-plane-rename.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(agent-control-plane): finalize product rename"
          git push origin HEAD:main
