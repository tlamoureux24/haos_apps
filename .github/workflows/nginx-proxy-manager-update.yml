name: Update Nginx Proxy Manager

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: nginx-proxy-manager-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      branch: ${{ steps.commit.outputs.branch }}
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read latest stable upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/NginxProxyManager/nginx-proxy-manager/releases/latest)"
          version="$(jq -r '.tag_name' <<<"${release}")"
          draft="$(jq -r '.draft' <<<"${release}")"
          prerelease="$(jq -r '.prerelease' <<<"${release}")"
          version="${version#v}"

          if [[ "${draft}" != "false" || "${prerelease}" != "false" ]]; then
            echo "Latest release is not stable" >&2
            exit 1
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported upstream version: ${version}" >&2
            exit 1
          fi

          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve and verify official image digest
        id: image
        env:
          NPM_VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          image="docker.io/jc21/nginx-proxy-manager"
          digest="$(docker buildx imagetools inspect "${image}:${NPM_VERSION}" \
            | sed -n 's/^Digest: *//p' | head -n 1)"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Cannot resolve the digest of ${image}:${NPM_VERSION}" >&2
            exit 1
          fi
          # Check the platforms of the exact image that will be pinned.
          manifest="$(docker buildx imagetools inspect "${image}:${NPM_VERSION}@${digest}")"
          grep -q 'linux/amd64' <<<"${manifest}"
          grep -q 'linux/arm64' <<<"${manifest}"

          current="$(<nginx_proxy_manager/upstream_version)"
          current_digest="$(sed -n 's/^ARG NPM_DIGEST="@\{0,1\}\([^"]*\)"$/\1/p' \
            nginx_proxy_manager/Dockerfile)"
          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"
          if [[ "${NPM_VERSION}" != "${current}" ]]; then
            echo "changed=true" >>"${GITHUB_OUTPUT}"
            echo "NPM update detected: ${current} -> ${NPM_VERSION} (${digest})"
          elif [[ -z "${current_digest}" ]]; then
            echo "changed=true" >>"${GITHUB_OUTPUT}"
            echo "NPM ${current} is not pinned by digest yet; pinning ${digest}"
          elif [[ "${current_digest}" == "${digest}" ]]; then
            echo "changed=false" >>"${GITHUB_OUTPUT}"
            echo "NPM ${current} is already current and pinned to ${digest}"
          else
            # A released upstream tag now points to another image. Never follow
            # it silently: it may be a legitimate rebuild or a compromised push.
            echo "::error title=NPM ${current} tag moved::${image}:${current} moved from ${current_digest} to ${digest}. Investigate upstream before pinning the new digest manually." >&2
            exit 1
          fi

      - name: Update package version
        id: package
        if: steps.image.outputs.changed == 'true'
        env:
          NPM_VERSION: ${{ steps.upstream.outputs.version }}
          NPM_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          python3 nginx_proxy_manager/scripts/update_npm_version.py "${NPM_VERSION}" "${NPM_DIGEST}"
          package="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' nginx_proxy_manager/config.yaml)"
          echo "package=${package}" >>"${GITHUB_OUTPUT}"

      - name: Validate package metadata and scripts
        if: steps.image.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 nginx_proxy_manager/scripts/validate.py
          bash -n nginx_proxy_manager/entrypoint.sh
          python3 -m py_compile \
            nginx_proxy_manager/scripts/update_npm_version.py \
            nginx_proxy_manager/scripts/validate.py

      - name: Build wrapper
        if: steps.image.outputs.changed == 'true'
        env:
          APP_VERSION: ${{ steps.package.outputs.package }}
        run: |
          set -euo pipefail
          # NPM_VERSION and NPM_DIGEST come from the updated Dockerfile defaults,
          # exactly as in the image publication workflow.
          docker build --pull \
            --build-arg "BUILD_VERSION=${APP_VERSION}" \
            --build-arg "BUILD_ARCH=amd64" \
            --tag "ha-npm-smoke:${APP_VERSION}" \
            nginx_proxy_manager

      - name: Smoke-test NPM startup
        if: steps.image.outputs.changed == 'true'
        env:
          NPM_VERSION: ${{ steps.upstream.outputs.version }}
          APP_VERSION: ${{ steps.package.outputs.package }}
        run: |
          set -euo pipefail
          cleanup() {
            docker logs ha-npm-smoke 2>&1 || true
            docker rm --force ha-npm-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name ha-npm-smoke \
            --publish 127.0.0.1:18081:81 \
            "ha-npm-smoke:${APP_VERSION}"

          for attempt in {1..60}; do
            if health="$(curl --fail --silent --show-error http://127.0.0.1:18081/api/ 2>/dev/null)"; then
              jq --exit-status --arg version "${NPM_VERSION}" '
                .status == "OK"
                and .setup == false
                and ([.version.major, .version.minor, .version.revision] | map(tostring) | join(".")) == $version
              ' <<<"${health}" >/dev/null
              echo "NPM ${NPM_VERSION} API is healthy and ready for initial setup"
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' ha-npm-smoke)" != "true" ]]; then
              echo "NPM container stopped during startup" >&2
              exit 1
            fi
            sleep 2
          done

          echo "NPM administration UI did not become ready" >&2
          exit 1

      - name: Commit validated update to staging branch
        id: commit
        if: steps.image.outputs.changed == 'true'
        env:
          APP_VERSION: ${{ steps.package.outputs.package }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nginx_proxy_manager/CHANGELOG.md \
            nginx_proxy_manager/Dockerfile \
            nginx_proxy_manager/config.yaml \
            nginx_proxy_manager/upstream_version
          git commit -m "Update Nginx Proxy Manager app to ${APP_VERSION}"
          # main only moves once the images for this commit are public.
          branch="automation/nginx-proxy-manager-update"
          git push --force origin "HEAD:refs/heads/${branch}"
          echo "branch=${branch}" >>"${GITHUB_OUTPUT}"
          echo "sha=$(git rev-parse HEAD)" >>"${GITHUB_OUTPUT}"

  publish:
    needs: update
    if: needs.update.outputs.sha != ''
    uses: ./.github/workflows/app-images-publish.yml
    permissions:
      contents: write
      packages: write
    with:
      apps: nginx_proxy_manager
      ref: ${{ needs.update.outputs.sha }}
      promote: true
      staging_branch: ${{ needs.update.outputs.branch }}
