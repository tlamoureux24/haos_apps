name: Validate Documentation

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "scripts/validate_docs.py"
      - ".github/workflows/documentation-validate.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/validate_docs.py"
      - ".github/workflows/documentation-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Validate Markdown and local links
        run: python3 scripts/validate_docs.py
