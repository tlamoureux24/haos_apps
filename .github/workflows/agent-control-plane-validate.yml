            http://127.0.0.1:18100/mcp)" = "401"
          curl --fail --silent --request POST \
            --header "Authorization: Bearer ${observer_credential}" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            http://127.0.0.1:18100/mcp | mcp_result | jq -e '.result.serverInfo.name == "Agent Control Plane"'
          curl --fail --silent --request POST \
            --header "Authorization: Bearer ${observer_credential}" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            http://127.0.0.1:18100/mcp | mcp_result | jq -e '.result.tools | map(.name) == ["control_plane_status_v1","permissions_get_effective_v1","events_list_v1","events_get_v1","jobs_list_v1","jobs_get_v1","reports_list_v1","reports_get_v1"]'
          curl --fail --silent --request POST \
            --header "Authorization: Bearer ${observer_credential}" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"control_plane_status_v1","arguments":{}}}' \
            http://127.0.0.1:18100/mcp | mcp_result | jq -e '.result.structuredContent.status == "ready"'
          event_id="$(jq -er '.event_id' /tmp/event-first.json)"
          job_id="$(jq -er '.job_id' /tmp/event-first.json)"
          curl --fail --silent --request POST \
            --header "Authorization: Bearer ${observer_credential}" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data "$(jq --null-input --compact-output --arg event_id "${event_id}" '{jsonrpc:"2.0",id:4,method:"tools/call",params:{name:"events_get_v1",arguments:{event_id:$event_id}}}')" \
            http://127.0.0.1:18100/mcp | mcp_result | jq -e --arg event_id "${event_id}" '.result.structuredContent.event.id == $event_id'
          curl --fail --silent --request POST \
            --header "Authorization: Bearer ${observer_credential}" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data "$(jq --null-input --compact-output --arg job_id "${job_id}" '{jsonrpc:"2.0",id:5,method:"tools/call",params:{name:"jobs_get_v1",arguments:{job_id:$job_id}}}')" \
            http://127.0.0.1:18100/mcp | mcp_result | jq -e --arg job_id "${job_id}" '.result.structuredContent.job.id == $job_id'
          curl --fail --silent --request POST \
            --header "Authorization: Bearer ${credential}" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":6,"method":"tools/list","params":{}}' \
            http://127.0.0.1:18100/mcp | mcp_result | jq -e '.result.tools | map(.name) == ["permissions_get_effective_v1"]'
          worker_response="$(curl --fail --silent \
            --request POST \
            --header "X-Ingress-Path: ${ingress_path}" \
            --header "X-CSRF-Token: ${csrf_token}" \
            --header "Cookie: acp_csrf=${csrf_token}" \
            --header "Content-Type: application/json" \
            --data '{"display_name":"CI MCP worker","identity_type":"client","actions":["jobs.claim","jobs.heartbeat","jobs.complete","jobs.fail"]}' \
            http://127.0.0.1:18099/admin/api/v1/identities)"
          worker_credential="$(printf '%s' "${worker_response}" | jq -er '.credential')"
          worker_tools="$(curl --fail --silent --request POST \
            --header "Authorization: Bearer ${worker_credential}" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":7,"method":"tools/list","params":{}}' \
            http://127.0.0.1:18100/mcp | mcp_result)"
          printf '%s' "${worker_tools}" | jq -e '
            (.result.tools | length) == 5 and
            ([.result.tools[].name] - ["jobs_claim_v1","jobs_heartbeat_v1","jobs_complete_v1","jobs_fail_v1"] | length) == 1'
          queued_capability="$(printf '%s' "${worker_tools}" | jq -er '
            [.result.tools[].name] - ["jobs_claim_v1","jobs_heartbeat_v1","jobs_complete_v1","jobs_fail_v1"] | first')"
          curl --fail --silent --request POST \
            --header "Authorization: Bearer ${worker_credential}" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data "$(jq --null-input --compact-output --arg capability "${queued_capability}" '{jsonrpc:"2.0",id:8,method:"tools/call",params:{name:$capability,arguments:{}}}')" \
            http://127.0.0.1:18100/mcp | mcp_result | jq -e '.result.isError == true'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "X-Ingress-Path: ${ingress_path}" \
            --header "Content-Type: application/json" \
            --data "{\"job_id\":\"${job_id}\"}" \
            http://127.0.0.1:18099/admin/api/v1/jobs/cancel)" = "403"
          curl --fail --silent --request POST \
            --header "X-Ingress-Path: ${ingress_path}" \
            --header "X-CSRF-Token: ${csrf_token}" \
            --header "Cookie: acp_csrf=${csrf_token}" \
            --header "Content-Type: application/json" \
            --data "{\"job_id\":\"${job_id}\"}" \
            http://127.0.0.1:18099/admin/api/v1/jobs/cancel | \
            jq -e --arg job_id "${job_id}" '.job_id == $job_id and .state == "cancelled"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "X-Ingress-Path: ${ingress_path}" \
            --header "X-CSRF-Token: ${csrf_token}" \
            --header "Cookie: acp_csrf=${csrf_token}" \
            --header "Content-Type: application/json" \
            --data "{\"job_id\":\"${job_id}\"}" \
            http://127.0.0.1:18099/admin/api/v1/jobs/cancel)" = "409"
          curl --fail --silent \
            --header "X-Ingress-Path: ${ingress_path}" \
            http://127.0.0.1:18099/admin/api/v1/jobs | \
            jq -e --arg job_id "${job_id}" 'any(.jobs[]; .id == $job_id and .state == "cancelled")'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --data "{\"job_id\":\"${job_id}\"}" \
            http://127.0.0.1:18098/admin/api/v1/jobs/cancel)" = "404"
          curl --fail --silent \
            --header "Authorization: Bearer ${credential}" \
            http://127.0.0.1:18100/api/v1/permissions/effective | \
            jq -e '.control_plane_actions | index("events.create")'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18100/api/v1/permissions/effective)" = "401"
          docker exec --env PYTHONPATH=/app/src agent-control-plane-smoke \
            su-exec agent-control-plane:agent-control-plane \
            python3 -c 'import sqlite3; connection=sqlite3.connect("/data/agent_control_plane.db"); assert connection.execute("SELECT count(*) FROM audit_entries WHERE decision=\"denied\"").fetchone()[0] >= 1'
          curl --fail --silent \
            --header "X-Ingress-Path: ${ingress_path}" \
            http://127.0.0.1:18099/admin/api/v1/audit | \
            jq -e '.limit == 200 and (.audit_entries | length >= 4 and any(.decision == "denied") and all(has("credential_id") | not))'
          curl --fail --silent \
            --header "X-Ingress-Path: ${ingress_path}" \
            http://127.0.0.1:18099/admin/api/v1/audit/export \
            --output /tmp/agent-control-plane-audit.jsonl
          test "$(wc -l </tmp/agent-control-plane-audit.jsonl)" -ge 4
          jq -e '.schema_version == 1 and (.audit_entry.entry_hash | length == 64) and (.audit_entry | has("credential_id") | not)' /tmp/agent-control-plane-audit.jsonl >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18098/admin/api/v1/audit)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18099/admin/api/v1/status)" = "403"
          echo "SMOKE_STAGE=api-ready"

          initial_pid="$(docker inspect agent-control-plane-smoke --format '{{.State.Pid}}')"
          docker restart agent-control-plane-smoke >/dev/null
          for attempt in {1..30}; do
            restarted_pid="$(docker inspect agent-control-plane-smoke --format '{{.State.Pid}}')"
            if [[ "${restarted_pid}" != "0" && "${restarted_pid}" != "${initial_pid}" ]]; then
              break
            fi
            sleep 1
          done
          test "${restarted_pid}" != "${initial_pid}"
          wait_ready
          echo "SMOKE_STAGE=restart-ready"
          curl --fail --silent \
            --header "X-Ingress-Path: ${ingress_path}" \
            http://127.0.0.1:18099/admin/api/v1/activity | \
            jq -e 'any(.entries[]; .event_code == "app_stopped")'
          curl --fail --silent \
            --header "Authorization: Bearer ${credential}" \
            http://127.0.0.1:18100/api/v1/permissions/effective | \
            jq -e '.control_plane_actions | index("events.create")'
