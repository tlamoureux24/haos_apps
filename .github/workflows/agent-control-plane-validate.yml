name: Validate Agent Control Plane App

on:
  workflow_call:
    inputs:
      full_validation:
        type: boolean
        default: true
      export_image:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full_validation:
        type: boolean
        default: true
      export_image:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent-control-plane-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python with dependency cache
        if: inputs.full_validation
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: agent_control_plane/requirements.txt

      - name: Validate metadata and source
        if: inputs.full_validation
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            --requirement agent_control_plane/requirements.txt
          python3 agent_control_plane/scripts/validate.py
          bash -n agent_control_plane/run.sh
          python3 -m compileall -q \
            agent_control_plane/src \
            agent_control_plane/tests
          PYTHONPATH=agent_control_plane/src \
            python3 -m unittest discover -s agent_control_plane/tests -v

      - name: Build amd64 image
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' agent_control_plane/config.yaml)"
          docker pull ghcr.io/home-assistant/base:latest
          base_reference="$(docker image inspect ghcr.io/home-assistant/base:latest \
            --format '{{index .RepoDigests 0}}')"
          base_digest="${base_reference##*@}"
          test -n "${base_digest}"
          test "${base_digest}" != "${base_reference}"
          docker build \
            --build-arg BUILD_ARCH=amd64 \
            --build-arg "BUILD_VERSION=${version}" \
            --build-arg "BASE_IMAGE_DIGEST=${base_digest}" \
            --tag "agent-control-plane:${version}" \
            agent_control_plane
          recorded_digest="$(docker image inspect "agent-control-plane:${version}" \
            --format '{{index .Config.Labels "org.opencontainers.image.base.digest"}}')"
          test "${recorded_digest}" = "${base_digest}"
          printf '%s\n' \
            'base_name=ghcr.io/home-assistant/base:latest' \
            "base_digest=${base_digest}" \
            "agent_control_plane_version=${version}" \
            "source_commit=${GITHUB_SHA}" \
            > agent_control_plane-base-image.txt
          {
            echo '### Agent Control Plane base image'
            echo
            echo '`ghcr.io/home-assistant/base:latest`'
            echo
            echo "Resolved digest: \`${base_digest}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Export amd64 image for TLS integration
        if: inputs.export_image
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' agent_control_plane/config.yaml)"
          docker save "agent-control-plane:${version}" | gzip -1 > "${RUNNER_TEMP}/agent-control-plane-image.tar.gz"

      - name: Upload amd64 image for TLS integration
        if: inputs.export_image
        uses: actions/upload-artifact@v6
        with:
          name: agent-control-plane-image
          path: ${{ runner.temp }}/agent-control-plane-image.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Upload base image provenance
        if: inputs.full_validation
        uses: actions/upload-artifact@v6
        with:
          name: agent-control-plane-base-image
          path: agent_control_plane-base-image.txt
          if-no-files-found: error
          retention-days: 90

      - name: Smoke-test root-only external TLS key
        if: inputs.full_validation
        run: |
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' agent_control_plane/config.yaml)"
          bash scripts/external_tls_key_smoke.sh acp "agent-control-plane:${version}"

      - name: Build ephemeral AppArmor trace image
        if: inputs.full_validation
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' agent_control_plane/config.yaml)"
          docker build \
            --file agent_control_plane/scripts/Dockerfile.apparmor-audit \
            --build-arg "BASE_IMAGE=agent-control-plane:${version}" \
            --tag "agent-control-plane-apparmor-audit:${version}" \
            agent_control_plane

      - name: Trace application executable inventory
        if: inputs.full_validation
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' agent_control_plane/config.yaml)"
          trace_root="${RUNNER_TEMP}/agent-control-plane-apparmor-audit"
          mkdir -p "${trace_root}/data" "${trace_root}/trace"

          cleanup() {
            docker logs agent-control-plane-apparmor-audit 2>&1 || true
            docker rm --force agent-control-plane-apparmor-audit >/dev/null 2>&1 || true
            docker logs agent-control-plane-s6-inventory 2>&1 || true
            docker rm --force agent-control-plane-s6-inventory >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name agent-control-plane-apparmor-audit \
            --publish 127.0.0.1:28100:8100 \
            --publish 127.0.0.1:28099:8099 \
            --volume "${trace_root}/data:/data" \
            --volume "${trace_root}/trace:/tmp/apparmor-audit" \
            "agent-control-plane-apparmor-audit:${version}"

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:28100/health/ready >/dev/null; then
              break
            fi
            if [ "${attempt}" = 60 ]; then
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:28100/health/live >/dev/null
          docker stop --time 15 agent-control-plane-apparmor-audit >/dev/null
          python3 agent_control_plane/scripts/summarize_apparmor_trace.py \
            "${trace_root}/trace" \
            --output "${trace_root}/executables.txt"
          test -s "${trace_root}/executables.txt"
          grep -Fx '/bin/sh' "${trace_root}/executables.txt"

          docker run --detach \
            --name agent-control-plane-s6-inventory \
            --publish 127.0.0.1:28100:8100 \
            --volume "${trace_root}/data:/data" \
            "agent-control-plane:${version}"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:28100/health/ready >/dev/null; then
              break
            fi
            if [ "${attempt}" = 60 ]; then
              exit 1
            fi
            sleep 1
          done

          docker exec agent-control-plane-s6-inventory /bin/sh -c '
            for process in /proc/[0-9]*; do
              readlink -f "${process}/exe" 2>/dev/null || true
            done
          ' > "${trace_root}/s6-running-executables.txt"
          docker run --rm --entrypoint /bin/sh "agent-control-plane:${version}" -c '
            find /package -type f -perm /111 -print
            find /command -maxdepth 1 -type l -print
            for executable in /command/*; do
              readlink -f "${executable}" 2>/dev/null || true
            done
          ' > "${trace_root}/s6-package-executables.txt"
          docker stop --time 15 agent-control-plane-s6-inventory >/dev/null

          sort -u \
            "${trace_root}/executables.txt" \
            "${trace_root}/s6-running-executables.txt" \
            "${trace_root}/s6-package-executables.txt" \
            > agent_control_plane-apparmor-executables.txt
          cp "${trace_root}/executables.txt" \
            agent_control_plane-apparmor-application-executables.txt
          cp "${trace_root}/s6-running-executables.txt" \
            agent_control_plane-apparmor-s6-running-executables.txt
          cp "${trace_root}/s6-package-executables.txt" \
            agent_control_plane-apparmor-s6-package-executables.txt

      - name: Upload AppArmor executable inventory
        if: inputs.full_validation
        uses: actions/upload-artifact@v6
        with:
          name: agent-control-plane-apparmor-executables
          path: agent_control_plane-apparmor-*-executables.txt
          if-no-files-found: error
          retention-days: 7

      - name: Validate expected s6 service-definition inventory
        if: inputs.full_validation
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' agent_control_plane/config.yaml)"
          docker run --rm --entrypoint /bin/sh "agent-control-plane:${version}" -c '
            test "$(find /etc/s6-overlay/s6-rc.d -print | wc -l)" = 7
            test "$(find /etc/s6-overlay/s6-rc.d/user/contents.d -print | wc -l)" = 1
            test "$(find /etc/s6-overlay/s6-rc.d/user2/contents.d -print | wc -l)" = 1
            test "$(readlink -f /command/printcontenv)" = "/package/admin/s6-overlay-3.2.3.0/command/printcontenv"
          '

      - name: Validate packaged s6-rc source inventory
        if: inputs.full_validation
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' agent_control_plane/config.yaml)"
          docker run --rm --entrypoint /bin/sh "agent-control-plane:${version}" -c '
            root=/package/admin/s6-overlay-3.2.3.0/etc/s6-rc/sources
            test "$(find "${root}" -print | wc -l)" = 29
            test "$(find "${root}" -type d -print | wc -l)" = 10
            test "$(find "${root}" -type f -print | wc -l)" = 19
          '

      - name: Validate packaged s6-rc script inventory
        if: inputs.full_validation
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' agent_control_plane/config.yaml)"
          docker run --rm --entrypoint /bin/sh "agent-control-plane:${version}" -c '
            root=/package/admin/s6-overlay-3.2.3.0/etc/s6-rc/scripts
            test "$(find "${root}" -print | wc -l)" = 6
            test "$(find "${root}" -type d -print | wc -l)" = 1
            test "$(find "${root}" -type f -print | wc -l)" = 5
          '

      - name: Validate with-contenv path used by AppArmor
        if: inputs.full_validation
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' agent_control_plane/config.yaml)"
          docker run --rm --entrypoint /bin/sh "agent-control-plane:${version}" -c '
            test -L /usr/bin/with-contenv
            test "$(readlink -f /usr/bin/with-contenv)" = "/package/admin/s6-overlay-3.2.3.0/command/with-contenv"
          '

      - name: Validate su-exec path used by AppArmor
        if: inputs.full_validation
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' agent_control_plane/config.yaml)"
          docker run --rm --entrypoint /bin/sh "agent-control-plane:${version}" -c '
            test "$(command -v su-exec)" = "/sbin/su-exec"
            test -f /sbin/su-exec
            test ! -L /sbin/su-exec
          '

      - name: Smoke-test listener isolation and persistence
        if: inputs.full_validation
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' agent_control_plane/config.yaml)"
          root="${RUNNER_TEMP}/agent-control-plane-smoke"
          mkdir -p "${root}/data"

          cleanup() {
            docker logs agent-control-plane-smoke 2>&1 || true
            docker rm --force agent-control-plane-smoke >/dev/null 2>&1 || true
            docker network rm agent-control-plane-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          wait_ready() {
            for attempt in {1..60}; do
              if curl --fail --silent http://127.0.0.1:18098/health/ready | jq -e '.status == "ready"' >/dev/null && \
                 curl --fail --silent http://127.0.0.1:18100/health/ready | jq -e '.status == "ready"' >/dev/null && \
                 curl --fail --silent --header "X-Ingress-Path: /api/hassio_ingress/ci" \
                   http://127.0.0.1:18099/health/ready | jq -e '.status == "ready"' >/dev/null; then
                return 0
              fi
              sleep 1
            done
            docker inspect agent-control-plane-smoke --format 'READINESS_FAILURE|status={{.State.Status}}|running={{.State.Running}}|exit={{.State.ExitCode}}|ports={{json .NetworkSettings.Ports}}'
            return 1
          }

          mcp_result() {
            sed -n 's/^data: //p' | jq -s 'map(select(has("id"))) | last'
          }

          docker network create agent-control-plane-smoke >/dev/null
          ingress_proxy_ip="$(docker network inspect agent-control-plane-smoke --format '{{(index .IPAM.Config 0).Gateway}}')"
          docker run --detach \
            --name agent-control-plane-smoke \
            --network agent-control-plane-smoke \
          --cap-drop DAC_OVERRIDE \
          --env "AGENT_CONTROL_PLANE_INGRESS_PROXY_IP=${ingress_proxy_ip}" \
          --env "AGENT_CONTROL_PLANE_INTAKE_RATE_LIMIT=1" \
          --env "AGENT_CONTROL_PLANE_MCP_TRANSPORT=http" \
            --publish 127.0.0.1:18098:8100 \
            --publish 127.0.0.1:18100:8098 \
            --publish 127.0.0.1:18099:8099 \
            --volume "${root}/data:/data" \
            "agent-control-plane:${version}"

          wait_ready
          echo "SMOKE_STAGE=initial-ready"
          docker logs agent-control-plane-smoke 2>&1 | grep -F 'WARNING: Event Intake API uses unencrypted HTTP'
          docker logs agent-control-plane-smoke 2>&1 | grep -F 'WARNING: MCP Worker Endpoint uses unencrypted HTTP'
          if docker logs agent-control-plane-smoke 2>&1 | grep -q 'IncompleteFieldDefinitionWarning'; then
            echo 'Unexpected MCP/Pydantic settings warning' >&2
            exit 1
          fi
          ingress_page="$(curl --fail --silent \
            --header "X-Ingress-Path: /api/hassio_ingress/ci" \
            http://127.0.0.1:18099/)"
          [[ "${ingress_page}" == *"Agent Control Plane"* ]]
          [[ "${ingress_page}" == *'id="service-health"'* ]]
          [[ "${ingress_page}" == *'src="/api/hassio_ingress/ci/admin/assets/admin.js"'* ]]
          [[ "${ingress_page}" == *'src="/api/hassio_ingress/ci/admin/assets/icon.png"'* ]]
          [[ "${ingress_page}" == *'href="#audit"'* ]]
          [[ "${ingress_page}" == *"Agent Control Plane <b>v${version}</b>"* ]]
          curl --fail --silent \
            --header "X-Ingress-Path: /api/hassio_ingress/ci" \
            http://127.0.0.1:18099/admin/api/v1/status | \
            jq -e '
              .status == "ready" and
              .surface == "admin" and
              .connectors == {"total":0,"ready":0,"unavailable":0,"disabled":0,"archived":0} and
              .tasks == {"total":0,"ready":0,"unavailable":0,"disabled":0,"archived":0} and
              .triggers == {"total":0,"active":0,"suspended":0,"disabled":0} and
              .schedules == {"total":0,"active":0,"suspended":0,"disabled":0} and
              .events_24h == 0 and
              .reports_24h == 0 and
              .failed_jobs_24h == 0 and
              .audit.valid == true and
              .audit.state == "valid" and
              .audit.entries == 2 and
              .audit.verified_entries == 2 and
              .audit.pending_entries == 0 and
              .audit.failed_sequence == null and
              (.audit.verified_at | type) == "string" and
              (.audit.full_verified_at | type) == "string"
            '
          curl --fail --silent \
            --header "X-Ingress-Path: /api/hassio_ingress/ci" \
            http://127.0.0.1:18099/admin/api/v1/activity | \
            jq -e '
              .limit == 100 and
              (.entries | length == 2) and
              ([.entries[].event_code] | sort == ["app_ready","app_started"]) and
              all(.entries[]; .category == "system" and .status == "success")
            '
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "X-Ingress-Path: /api/hassio_ingress/ci" \
            http://127.0.0.1:18099/admin/api/v1/connectors/legacy/tools)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18098/admin/api/v1/connectors/legacy/tools)" = "404"
          test "$(curl --silent --output /tmp/agent-control-plane-icon.png --write-out '%{http_code}' \
            --header "X-Ingress-Path: /api/hassio_ingress/ci" \
            http://127.0.0.1:18099/admin/assets/icon.png)" = "200"
          test "$(stat -c '%s' /tmp/agent-control-plane-icon.png)" -gt 1000
          echo "SMOKE_STAGE=ingress-ready"
          public_root_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18098/)"
          echo "SMOKE_CHECK=public-root:${public_root_status}"
          test "${public_root_status}" = "404"
          docker exec agent-control-plane-smoke \
            su-exec agent-control-plane:agent-control-plane \
            test -f /data/agent_control_plane.db
          private_stat="$(docker exec agent-control-plane-smoke su-exec agent-control-plane:agent-control-plane stat -c '%u:%g:%a' /data/private)"
          pepper_stat="$(docker exec agent-control-plane-smoke su-exec agent-control-plane:agent-control-plane stat -c '%u:%g:%a' /data/private/credential-pepper)"
          runtime_gid="$(docker exec agent-control-plane-smoke id -g agent-control-plane)"
          echo "SMOKE_CHECK=private:${private_stat} pepper:${pepper_stat}"
          test "${private_stat}" = "1000:${runtime_gid}:700"
          test "${pepper_stat}" = "1000:${runtime_gid}:600"
          docker cp agent_control_plane/tests/control_plane_smoke.py \
            agent-control-plane-smoke:/tmp/control_plane_smoke.py
          docker exec --env PYTHONPATH=/app/src agent-control-plane-smoke \
            su-exec agent-control-plane:agent-control-plane \
            python3 /tmp/control_plane_smoke.py
          echo "SMOKE_STAGE=database-api-ready"

          ingress_path="/api/hassio_ingress/ci"
          admin_page="$(curl --fail --silent \
            --header "X-Ingress-Path: ${ingress_path}" \
            http://127.0.0.1:18099/)"
          csrf_token="$(printf '%s' "${admin_page}" | sed -n 's/.*data-csrf="\([^"]*\)".*/\1/p')"
          test -n "${csrf_token}"
          identity_response="$(curl --fail --silent \
            --request POST \
            --header "X-Ingress-Path: ${ingress_path}" \
            --header "X-CSRF-Token: ${csrf_token}" \
            --header "Cookie: acp_csrf=${csrf_token}" \
            --header "Content-Type: application/json" \
            --data '{"display_name":"CI API source","identity_type":"event_source","actions":["events.create","permissions.effective.read"]}' \
            http://127.0.0.1:18099/admin/api/v1/identities)"
          credential="$(printf '%s' "${identity_response}" | jq -er '.credential')"
          source_identity_id="$(printf '%s' "${identity_response}" | jq -er '.identity_id')"
          curl --fail --silent \
            --request POST \
            --header "X-Ingress-Path: ${ingress_path}" \
            --header "X-CSRF-Token: ${csrf_token}" \
            --header "Cookie: acp_csrf=${csrf_token}" \
            --header "Content-Type: application/json" \
            --data "$(jq --null-input --compact-output --arg source "${source_identity_id}" '{display_name:"CI API alerts",source_identity_id:$source,event_type:"service.alert",task_id:"ci-inspection"}')" \
            http://127.0.0.1:18099/admin/api/v1/event-mappings | jq -e '.status == "active"'
          echo "SMOKE_STAGE=identity-ready"
          curl --fail --silent \
            --header "X-Ingress-Path: ${ingress_path}" \
            http://127.0.0.1:18099/admin/api/v1/identities | \
            jq -e '.identities | length == 4 and all(has("credential") | not)'
          occurred_at="$(date --utc +'%Y-%m-%dT%H:%M:%SZ')"
          event_payload="$(jq --null-input --compact-output \
            --arg occurred_at "${occurred_at}" \
            '{schema_version:1,event_type:"service.alert",occurred_at:$occurred_at,subject:{service_id:"ci-api-service"},attributes:{status:"unavailable"}}')"
          test "$(curl --silent --output /tmp/event-first.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${credential}" \
            --header "Idempotency-Key: ci-api-stable-key" \
            --header "Content-Type: application/json" \
            --data "${event_payload}" \
            http://127.0.0.1:18098/api/v1/events)" = "202"
          test "$(curl --silent --output /tmp/event-replay.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${credential}" \
            --header "Idempotency-Key: ci-api-stable-key" \
            --header "Content-Type: application/json" \
            --data "${event_payload}" \
            http://127.0.0.1:18098/api/v1/events)" = "200"
          test "$(jq -r '.event_id' /tmp/event-first.json)" = "$(jq -r '.event_id' /tmp/event-replay.json)"
          test "$(curl --silent --dump-header /tmp/rate-limit-headers.txt \
            --output /tmp/rate-limit.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${credential}" \
            --header "Idempotency-Key: ci-api-second-key" \
            --header "Content-Type: application/json" \
            --data "${event_payload}" \
            http://127.0.0.1:18098/api/v1/events)" = "429"
          jq -e '.error.code == "rate_limited"' /tmp/rate-limit.json
          grep -qi '^retry-after: 60' /tmp/rate-limit-headers.txt
          curl --fail --silent \
            --header "X-Ingress-Path: ${ingress_path}" \
            http://127.0.0.1:18099/admin/api/v1/events | \
            jq -e '.events | length == 8 and all(has("credential") | not)'
          curl --fail --silent \
            --header "X-Ingress-Path: ${ingress_path}" \
            http://127.0.0.1:18099/admin/api/v1/jobs | \
            jq -e '.jobs | length == 5 and any(.state == "queued") and any(.state == "completed") and any(.state == "dead_letter") and any(.state == "cancelled")'
          curl --fail --silent \
            --header "X-Ingress-Path: ${ingress_path}" \
            http://127.0.0.1:18099/admin/api/v1/reports | \
            jq -e '.reports | length == 1'
          echo "SMOKE_STAGE=event-api-ready"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${credential}" \
            http://127.0.0.1:18098/api/v1/events)" = "405"
          echo "SMOKE_STAGE=event-api-method-isolation-ready"
          observer_response="$(curl --fail --silent \
            --request POST \
            --header "X-Ingress-Path: ${ingress_path}" \
            --header "X-CSRF-Token: ${csrf_token}" \
            --header "Cookie: acp_csrf=${csrf_token}" \
            --header "Content-Type: application/json" \
            --data '{"display_name":"CI observer","identity_type":"client","actions":["control_plane.status.read","permissions.effective.read","events.read","jobs.read","reports.read"]}' \
            http://127.0.0.1:18099/admin/api/v1/identities)"
          observer_credential="$(printf '%s' "${observer_response}" | jq -er '.credential')"
          echo "SMOKE_STAGE=mcp-observer-ready"
          connector_status="$(curl --silent --output /tmp/connector-response.json --write-out '%{http_code}' \
            --request POST \
            --header "X-Ingress-Path: ${ingress_path}" \
            --header "X-CSRF-Token: ${csrf_token}" \
            --header "Cookie: acp_csrf=${csrf_token}" \
            --header "Content-Type: application/json" \
            --data "$(jq --null-input --compact-output --arg token "${observer_credential}" '{display_name:"CI generic MCP",url:"http://127.0.0.1:8098/mcp",bearer_token:$token}')" \
            http://127.0.0.1:18099/admin/api/v1/connectors)"
          if [[ "${connector_status}" != "201" ]]; then
            jq -c '{error: .error.code}' /tmp/connector-response.json >&2
            exit 1
          fi
          connector_response="$(cat /tmp/connector-response.json)"
