          test "$(curl --silent --output /tmp/connector-in-use.json --write-out '%{http_code}' \
            --request POST \
            --header "X-Ingress-Path: ${ingress_path}" \
            --header "X-CSRF-Token: ${csrf_token}" \
            --header "Cookie: acp_csrf=${csrf_token}" \
            --header "Content-Type: application/json" \
