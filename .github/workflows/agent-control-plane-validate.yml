            http://127.0.0.1:18099/admin/api/v1/connectors/delete)" = "409"
          jq -e '.error.code == "connector_in_use"' /tmp/connector-in-use.json
          docker exec --env "CI_CONNECTOR_ID=${connector_id}" --env "CI_CONNECTOR_TOKEN=${observer_credential}" agent-control-plane-smoke \
            su-exec agent-control-plane:agent-control-plane \
            python3 -c 'import os,sqlite3; row=sqlite3.connect("/data/agent_control_plane.db").execute("SELECT protected_config,display_endpoint FROM connectors WHERE id = ?", (os.environ["CI_CONNECTOR_ID"],)).fetchone(); assert row is not None; assert os.environ["CI_CONNECTOR_TOKEN"] not in row[0]; assert os.environ["CI_CONNECTOR_TOKEN"] not in row[1]; assert row[1] == "http://127.0.0.1:8098"'
          curl --fail --silent \
            --request POST \
            --header "X-Ingress-Path: ${ingress_path}" \
            --header "X-CSRF-Token: ${csrf_token}" \
            --header "Cookie: acp_csrf=${csrf_token}" \
            --header "Content-Type: application/json" \
            --data "{\"connector_id\":\"${connector_id}\",\"enabled\":false}" \
            http://127.0.0.1:18099/admin/api/v1/connectors/enabled | jq -e '.status == "disabled"'
          curl --fail --silent --header "X-Ingress-Path: ${ingress_path}" \
            http://127.0.0.1:18099/admin/api/v1/tasks | \
            jq -e 'any(.tasks[]; .name == "ci_status_task" and .status == "unavailable")'
          curl --fail --silent \
            --request POST \
            --header "X-Ingress-Path: ${ingress_path}" \
            --header "X-CSRF-Token: ${csrf_token}" \
            --header "Cookie: acp_csrf=${csrf_token}" \
            --header "Content-Type: application/json" \
            --data "{\"connector_id\":\"${connector_id}\",\"enabled\":true}" \
            http://127.0.0.1:18099/admin/api/v1/connectors/enabled | jq -e '.status == "ready"'
          curl --fail --silent --header "X-Ingress-Path: ${ingress_path}" \
            http://127.0.0.1:18099/admin/api/v1/tasks | \
            jq -e 'any(.tasks[]; .name == "ci_status_task" and .status == "ready")'
          curl --fail --silent \
            --request POST \
            --header "X-Ingress-Path: ${ingress_path}" \
            --header "X-CSRF-Token: ${csrf_token}" \
            --header "Cookie: acp_csrf=${csrf_token}" \
            --header "Content-Type: application/json" \
            --data "{\"task_id\":\"$(printf '%s' "${task_response}" | jq -er '.task_id')\"}" \
