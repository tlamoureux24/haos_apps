version: 2
updates:
  # Workflow actions are pinned to full commit SHAs. Dependabot keeps the SHA
  # and the trailing "# vX.Y.Z" comment up to date through reviewable PRs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
